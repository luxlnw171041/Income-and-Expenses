<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

/* ============================================================
   1) CONFIG — ใส่ค่า Supabase ของคุณตรงนี้ (ระบบใช้ Supabase จริงเท่านั้น
   ไม่มี Mock Mode แล้ว ต้องตั้งค่าให้ครบก่อนใช้งาน)
   ============================================================ */
const SUPABASE_URL = 'https://dfemavcrzpmmgqqjrxvz.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmZW1hdmNyenBtbWdxcWpyeHZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2ODY4NTEsImV4cCI6MjEwMTI2Mjg1MX0.JYsRkjRwbAqKxqB9MT5iMDOeh5zh087sWmKo_Jx1cbc';

const CONFIGURED = !SUPABASE_URL.includes('SUPABASE_URL') && !!SUPABASE_ANON_KEY && !SUPABASE_ANON_KEY.includes('YOUR_SUPABASE');
const supabase = CONFIGURED ? createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

/* ============================================================
   2) TOAST
   ============================================================ */
function toast(msg, kind = 'info') {
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  const styles = {
    info: 'bg-ink text-white',
    success: 'bg-success text-white',
    error: 'bg-danger text-white',
    offline: 'bg-accent text-white',
  };
  el.className = `toast ${styles[kind] || styles.info} text-sm font-medium px-4 py-2.5 rounded-full shadow-lg max-w-[90%] text-center`;
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 250); }, 2600);
}

/* ============================================================
   3) OFFLINE QUEUE (localStorage) + AUTO SYNC
   ============================================================ */
const QUEUE_KEY = 'pending_stock_sync';

function getQueue() { try { return JSON.parse(localStorage.getItem(QUEUE_KEY)) || []; } catch { return []; } }
function setQueue(q) { localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); updateNetBadge(); }
function pushToQueue(item) { const q = getQueue(); q.push({ ...item, queued_at: Date.now() }); setQueue(q); }

async function syncQueue() {
  if (!navigator.onLine) return;
  let q = getQueue();
  if (q.length === 0) return;
  toast(`กำลังซิงค์ข้อมูล ${q.length} รายการ...`, 'info');
  while (q.length > 0) {
    const item = q[0];
    try {
      await DB.processStockAudit(item.payload, true);
      q.shift();
      setQueue(q);
    } catch (e) {
      console.error('sync failed', e);
      break; // stop FIFO on first failure, retry later
    }
  }
  if (getQueue().length === 0) toast('ซิงค์ข้อมูลสำเร็จทั้งหมด ✓', 'success');
  refreshCurrentRoute();
}

window.addEventListener('online', () => { updateNetBadge(); syncQueue(); });
window.addEventListener('offline', updateNetBadge);

function updateNetBadge() {
  const dot = document.getElementById('net-dot');
  const label = document.getElementById('net-label');
  const badge = document.getElementById('net-badge');
  const pending = getQueue().length;
  if (navigator.onLine) {
    badge.className = 'flex items-center gap-1.5 text-xs font-medium px-2.5 py-1 rounded-full border border-success/30 bg-success-light text-success';
    dot.className = 'w-2 h-2 rounded-full bg-success';
    label.textContent = pending > 0 ? `ออนไลน์ · ซิงค์ ${pending}` : 'ออนไลน์';
  } else {
    badge.className = 'flex items-center gap-1.5 text-xs font-medium px-2.5 py-1 rounded-full border border-danger/30 bg-danger-light text-danger';
    dot.className = 'w-2 h-2 rounded-full bg-danger pulse-dot';
    label.textContent = pending > 0 ? `ออฟไลน์ · รอ ${pending}` : 'ออฟไลน์';
  }
}

/* ============================================================
   4) uid() — small local id generator, still used by the standalone
   cost/profit calculator's scratch list (section 11), which is
   intentionally local-only and never touches Supabase.
   ============================================================ */
function uid(p) { return p + '_' + Math.random().toString(36).slice(2, 9); }

/* ============================================================
   5) DATA ACCESS LAYER — Supabase only
   ============================================================ */
const DB = {
  async getBuildings() {
    const { data, error } = await supabase.from('buildings').select('*').order('name');
    if (error) throw error; return data;
  },
  async getShelves(buildingId) {
    const { data, error } = await supabase.from('shelves').select('*').eq('building_id', buildingId).order('floor');
    if (error) throw error; return data;
  },
  async getShelfItems(shelfId) {
    // NOTE: previously this used a single query with an invalid double-nested
    // embed (`stock_batches:products(stock_batches(...))`), which does not
    // describe a real foreign-key path and returned undefined/empty data —
    // so cost_price (and therefore the loss value shown while counting stock)
    // silently resolved to 0 for every item. Fixed by fetching the shelf
    // items and the latest cost per product in two simple, correct queries.
    const { data: rows, error } = await supabase
      .from('product_shelves')
      .select('id, quantity, product:products(id,name,selling_price,image_url,min_stock_alert)')
      .eq('shelf_id', shelfId);
    if (error) throw error;
    if (rows.length === 0) return [];

    const productIds = rows.map(r => r.product.id);
    const { data: batches, error: bErr } = await supabase
      .from('stock_batches')
      .select('product_id, cost_price, created_at')
      .in('product_id', productIds)
      .order('created_at', { ascending: false });
    if (bErr) throw bErr;

    const latestCostByProduct = {};
    for (const b of batches) {
      if (!(b.product_id in latestCostByProduct)) latestCostByProduct[b.product_id] = b.cost_price;
    }
    return rows.map(row => ({
      id: row.id, quantity: row.quantity, product: row.product,
      cost_price: latestCostByProduct[row.product.id] ?? 0,
    }));
  },
  async processStockAudit(payload, fromQueue = false) {
    // payload: { product_shelf_id, expected_qty, actual_qty, cost_price, product_name, account_id }
    const { data, error } = await supabase.rpc('process_stock_audit', {
      p_product_shelf_id: payload.product_shelf_id,
      p_actual_qty: payload.actual_qty,
    });
    if (error) throw error;
    return data;
  },
  async getDashboardOverview() {
    const { data, error } = await supabase.from('view_dashboard_overview').select('*').single();
    if (error) throw error; return data;
  },
  async getLowStockAlerts() {
    const { data, error } = await supabase.from('view_low_stock_alerts').select('*');
    if (error) throw error; return data;
  },
  async getAccounts() {
    const { data, error } = await supabase.from('accounts').select('*').order('type');
    if (error) throw error; return data;
  },
  async addTransaction({ account_id, type, category, amount, note }) {
    const { data, error } = await supabase.rpc('add_transaction', { p_account_id: account_id, p_type: type, p_category: category, p_amount: amount, p_note: note || null });
    if (error) throw error; return data;
  },
  async getRecentTransactions(limit = 8) {
    const { data, error } = await supabase.from('transactions').select('*').order('created_at', { ascending: false }).limit(limit);
    if (error) throw error; return data;
  },
  async addBuilding(name) {
    const { data, error } = await supabase.from('buildings').insert({ name }).select().single();
    if (error) throw error; return data;
  },
  async addShelf(building_id, floor) {
    const { data, error } = await supabase.from('shelves').insert({ building_id, floor }).select().single();
    if (error) throw error; return data;
  },
  async addProduct(p) {
    const { data, error } = await supabase.from('products').insert(p).select().single();
    if (error) throw error; return data;
  },
  async getProducts() {
    const { data, error } = await supabase.from('products').select('*').order('name');
    if (error) throw error; return data;
  },
  async addStockBatch(product_id, cost_price, qty) {
    const { data, error } = await supabase.from('stock_batches').insert({ product_id, cost_price, initial_qty: qty, remaining_qty: qty }).select().single();
    if (error) throw error; return data;
  },
  async getProductsWithCost() {
    // returns each product with its most recent cost_price + total remaining units across batches
    const { data: products, error } = await supabase.from('products').select('*').order('name');
    if (error) throw error;
    const { data: batches, error: bErr } = await supabase.from('stock_batches').select('*').order('created_at', { ascending: true });
    if (bErr) throw bErr;
    // Group batches by product_id in a single pass (was: `batches.filter(...)` re-scanning
    // the entire batches table once per product — O(products × batches), which gets slow
    // fast as stock history grows).
    const batchesByProduct = {};
    for (const b of batches) (batchesByProduct[b.product_id] ??= []).push(b);
    return products.map(p => {
      const pBatches = batchesByProduct[p.id] || [];
      const latest = pBatches[pBatches.length - 1];
      const remaining_units = pBatches.reduce((s, b) => s + b.remaining_qty, 0);
      return { ...p, cost_price: latest ? latest.cost_price : null, remaining_units };
    });
  },
  async assignProductToShelf(shelf_id, product_id, quantity) {
    const { data, error } = await supabase.from('product_shelves').upsert({ shelf_id, product_id, quantity }, { onConflict: 'shelf_id,product_id' }).select().single();
    if (error) throw error; return data;
  },
};

/* ============================================================
   6) ROUTER
   ============================================================ */
const app = document.getElementById('app');
let currentRoute = 'dashboard';
let routeState = {};

const routes = { dashboard: renderDashboard, count: renderCount, finance: renderFinance, inventory: renderInventory, calculator: renderCalculator };

function go(route, state = {}) {
  currentRoute = route; routeState = state;
  document.querySelectorAll('.navbtn').forEach(b => b.classList.toggle('active', b.dataset.route === route));
  app.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'screen';
  app.appendChild(wrap);
  routes[route](wrap, state);
  window.scrollTo({ top: 0 });
}
function refreshCurrentRoute() { go(currentRoute, routeState); }

document.querySelectorAll('.navbtn[data-route]').forEach(btn => {
  btn.addEventListener('click', () => go(btn.dataset.route));
});

function fmtMoney(n) { return Number(n || 0).toLocaleString('th-TH', { minimumFractionDigits: 0, maximumFractionDigits: 2 }); }

function skeleton(h = 'h-24') {
  return `<div class="shimmer rounded-2xl ${h} w-full"></div>`;
}

/* ============================================================
   7) DASHBOARD
   ============================================================ */
async function renderDashboard(root) {

      <h1 class="font-display text-2xl font-semibold">ภาพรวมวันนี้</h1>
    </div>
    <div id="dash-cards" class="grid grid-cols-2 gap-3 mb-3">
      ${skeleton('h-24')}${skeleton('h-24')}${skeleton('h-24')}${skeleton('h-24')}
    </div>
    <div id="dash-alerts" class="mb-6">${skeleton('h-32')}</div>
    <div>
      <h2 class="font-display font-semibold text-base mb-3">ทางลัด</h2>
      <div class="grid grid-cols-2 gap-3">
        <button id="qa-count" class="press bg-primary text-white rounded-2xl p-4 text-left shadow-sm">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mb-2"><path d="M9 3h6v3H9z"/><rect x="5" y="6" width="14" height="15" rx="2"/><path d="M9 12h6M9 16h6"/></svg>
          <div class="font-display font-medium text-sm">ไปนับสต็อก</div>
        </button>
        <button id="qa-finance" class="press bg-accent text-white rounded-2xl p-4 text-left shadow-sm">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mb-2"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg>
          <div class="font-display font-medium text-sm">บันทึกรายรับ-จ่าย</div>
        </button>
        <button id="qa-calc" class="press col-span-2 bg-surface border border-hairline rounded-2xl p-4 flex items-center gap-3 shadow-sm">
          <div class="w-9 h-9 rounded-xl bg-primary-light flex items-center justify-center text-primary shrink-0">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"/></svg>
          </div>

            <div class="font-display font-medium text-sm">คำนวณต้นทุน-กำไร</div>
            <div class="text-xs text-muted">คำนวณเฉยๆ ตอนซื้อของ ไม่บันทึกเข้าระบบ</div>

  `;
  root.querySelector('#qa-count').onclick = () => go('count');

  root.querySelector('#qa-calc').onclick = () => go('calculator', { from: 'dashboard' });

  try {
    const [overview, alerts] = await Promise.all([DB.getDashboardOverview(), DB.getLowStockAlerts()]);
    const cards = [
      { label: 'ยอดขายรวม', value: overview.total_sales, color: 'text-primary', icon: 'sale' },
      { label: 'กำไรสุทธิ', value: overview.net_profit ?? (overview.total_sales - overview.total_expenses), color: overview.net_profit >= 0 ? 'text-success' : 'text-danger', icon: 'profit' },
      { label: 'รายจ่ายรวม', value: overview.total_expenses, color: 'text-ink', icon: 'expense' },
      { label: 'มูลค่าสูญหาย', value: overview.total_loss_value, color: 'text-danger', icon: 'loss' },

    root.querySelector('#dash-cards').innerHTML = cards.map((c, i) => `
      <div class="bg-surface rounded-2xl p-4 border border-hairline pop-in" style="animation-delay:${i * 60}ms">

    const alertsHtml = alerts.length === 0

// Measures the real height of the fixed bottom nav + save bar, then docks the bar
// directly above the nav and pads the scrollable list so the last card is never hidden.
function dockFooterBar(bar, list) {
  const place = () => {
    const nav = document.querySelector('nav');
    const navH = nav ? nav.getBoundingClientRect().height : 72;
    bar.style.bottom = navH + 'px';
    const barH = bar.getBoundingClientRect().height;
    list.style.paddingBottom = (barH + 20) + 'px';
  };
  requestAnimationFrame(place);
  window.addEventListener('resize', place, { once: true });
}

function bindItemCard(root, id) {
  const input = root.querySelector(`[data-input="${id}"]`);
  const minus = root.querySelector(`[data-minus="${id}"]`);
  const plus = root.querySelector(`[data-plus="${id}"]`);
  const diffEl = root.querySelector(`[data-diff="${id}"]`);

  function setVal(v) {
    v = Math.max(0, v);
    input.value = v;
    countCart[id].actual = v;
    updateDiff();
  }
  function updateDiff() {
    const diff = countCart[id].actual - countCart[id].expected;
    diffEl.classList.remove('pop-in'); void diffEl.offsetWidth; diffEl.classList.add('pop-in');
    if (diff < 0) {
      const loss = Math.abs(diff) * countCart[id].cost_price;
      diffEl.className = 'pop-in text-xs font-display font-semibold px-2 py-1 rounded-full bg-danger-light text-danger tnum';
      diffEl.textContent = `${diff} ชิ้น (ขาดทุน ฿${fmtMoney(loss)})`;
    } else if (diff > 0) {
      diffEl.className = 'pop-in text-xs font-display font-semibold px-2 py-1 rounded-full bg-success-light text-success tnum';
      diffEl.textContent = `+${diff} ชิ้น`;
    } else {
      diffEl.className = 'pop-in text-xs font-display font-semibold px-2 py-1 rounded-full bg-hairline text-muted tnum';
      diffEl.textContent = '0';
    }
  }

  input.addEventListener('input', () => setVal(parseInt(input.value || '0', 10)));

  function holdRepeat(btn, delta) {
    let interval, timeout;
    const start = (e) => {
      e.preventDefault();
      setVal(countCart[id].actual + delta);
      timeout = setTimeout(() => { interval = setInterval(() => setVal(countCart[id].actual + delta), 90); }, 400);
    };
    const stop = () => { clearTimeout(timeout); clearInterval(interval); };
    btn.addEventListener('pointerdown', start);
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => btn.addEventListener(ev, stop));
  }
  holdRepeat(minus, -1);
  holdRepeat(plus, 1);
}

async function saveAudit(root, state) {
  const btn = root.querySelector('#save-audit');
  btn.disabled = true;
  btn.innerHTML = `<span class="animate-spin inline-block w-5 h-5 border-2 border-white/40 border-t-white rounded-full"></span>`;
  const entries = Object.entries(countCart);
  const accounts = await DB.getAccounts().catch(() => []);
  const businessAccount = accounts.find(a => a.type === 'business') || accounts[0];

  // Was: a `for...of` loop with `await` inside, so each item's save request
  // waited for the previous one to fully round-trip before starting the next —
  // for N shelf items that's N sequential network calls back to back, which is
  // exactly the "หน่วง" feeling on the save button. Each item is independent
  // (different product_shelf_id), so they're safe to fire in parallel.
  const results = await Promise.allSettled(entries.map(([psId, c]) => {
    const payload = {
      product_shelf_id: psId, expected_qty: c.expected, actual_qty: c.actual,
      cost_price: c.cost_price, product_name: c.product.name, account_id: businessAccount?.id,
    };
    if (!navigator.onLine) { pushToQueue({ payload }); return Promise.resolve('offline'); }
    return DB.processStockAudit(payload)
      .then(() => 'ok')
      .catch(() => { pushToQueue({ payload }); return 'offline'; });
  }));
  let okCount = results.filter(r => r.status === 'fulfilled' && r.value === 'ok').length;
  let offlineCount = results.filter(r => r.status === 'fulfilled' && r.value === 'offline').length;
  updateNetBadge();
  if (offlineCount > 0 && okCount === 0) toast(`บันทึกในเครื่องแล้ว (ออฟไลน์) — จะซิงค์อัตโนมัติเมื่อมีเน็ต`, 'offline');
  else if (offlineCount > 0) toast(`บันทึกแล้ว ${okCount} รายการ, อีก ${offlineCount} รอซิงค์`, 'info');
  else toast('บันทึกการนับสต็อกสำเร็จ ✓', 'success');

  go('dashboard');
}

      go('finance');

      toast('บันทึกไม่สำเร็จ: ' + e.message, 'error');
      txSaveBtn.disabled = false;
    }
  };

  root.querySelector('#cash-recon').onclick = async () => {
    const actual = parseFloat(root.querySelector('#cash-actual').value);
    if (isNaN(actual)) return toast('กรุณาใส่จำนวนเงินที่นับได้', 'error');
    const acc = accounts.find(a => a.id === selectedAccount);
    const diff = actual - acc.balance;
    if (diff === 0) return toast('ยอดตรงกันอยู่แล้ว ✓', 'success');
    try {
      await DB.addTransaction({ account_id: selectedAccount, type: diff > 0 ? 'income' : 'expense', category: 'กระทบยอดเงินสด', amount: Math.abs(diff), note: 'ปรับยอดให้ตรงกับเงินจริง' });
      toast(`ปรับยอด ${diff > 0 ? '+' : ''}฿${fmtMoney(diff)} สำเร็จ`, 'success');
      go('finance');
    } catch (e) { toast('ทำรายการไม่สำเร็จ: ' + e.message, 'error'); }
  };

  try {
    const txs = await DB.getRecentTransactions();
    root.querySelector('#tx-list').innerHTML = txs.length === 0 ? `<p class="text-sm text-muted text-center py-6">ยังไม่มีรายการ</p>` : txs.map(t => `
      <div class="bg-surface border border-hairline rounded-xl px-4 py-3 flex items-center justify-between">
        <div>
          <p class="text-sm font-medium">${t.category}</p>
          <p class="text-xs text-muted">${new Date(t.created_at).toLocaleDateString('th-TH', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' })}</p>
        </div>
        <span class="font-display font-semibold tnum ${t.type === 'income' ? 'text-success' : 'text-danger'}">${t.type === 'income' ? '+' : '−'}฿${fmtMoney(t.amount)}</span>
      </div>`).join('');
  } catch (e) { toast('โหลดรายการไม่สำเร็จ', 'error'); }
}

  const profitPerUnit = hasCost ? p.selling_price - p.cost_price : null;
  return `
  <div class="bg-surface border border-hairline rounded-xl px-4 py-3" data-product-row="${p.id}">
    <div class="flex items-center justify-between">
      <div class="min-w-0">
        <p class="text-sm font-medium truncate">${p.name}</p>
        <p class="text-xs text-muted">ขาย ฿${fmtMoney(p.selling_price)} · แจ้งเตือนที่ ≤${p.min_stock_alert}</p>
        ${hasCost
          ? `<p class="text-xs mt-1"><span class="text-muted">ต้นทุน ฿${fmtMoney(p.cost_price)}/ชิ้น</span> · <span class="font-medium ${profitPerUnit >= 0 ? 'text-primary' : 'text-danger'}">กำไร ฿${fmtMoney(profitPerUnit)}/ชิ้น</span></p>`
          : `<p class="text-xs mt-1 text-accent-dark">ยังไม่ได้ใส่ต้นทุน</p>`}
      </div>
      <button data-restock-toggle="${p.id}" class="press shrink-0 text-xs font-medium px-3 py-1.5 rounded-full bg-primary-light text-primary whitespace-nowrap">+ เติมต้นทุน</button>
    </div>
    <div data-restock-form="${p.id}" class="hidden mt-3 pt-3 border-t border-hairline space-y-2">
      <div class="flex gap-2">
        <input data-rc-total="${p.id}" type="number" inputmode="decimal" placeholder="ราคาต้นทุนรวม" class="flex-1 text-sm bg-bg rounded-xl px-3 py-2 outline-none">
        <input data-rc-qty="${p.id}" type="number" inputmode="numeric" placeholder="จำนวนที่ซื้อ" class="flex-1 text-sm bg-bg rounded-xl px-3 py-2 outline-none">
      </div>
      <div data-rc-calc="${p.id}" class="hidden text-xs text-primary bg-primary-light rounded-xl p-2.5 space-y-0.5"></div>
      <button data-rc-save="${p.id}" class="press w-full bg-primary text-white text-sm font-medium py-2 rounded-xl">บันทึกต้นทุนล็อตนี้</button>
    </div>
  </div>`;
}

function bindProductRestockForms(body, products) {
  body.querySelectorAll('[data-restock-toggle]').forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.restockToggle;
      body.querySelector(`[data-restock-form="${id}"]`).classList.toggle('hidden');
    };
  });
  products.forEach(p => {
    const totalInput = body.querySelector(`[data-rc-total="${p.id}"]`);
    const qtyInput = body.querySelector(`[data-rc-qty="${p.id}"]`);
    const calcBox = body.querySelector(`[data-rc-calc="${p.id}"]`);
    function update() {
      const total = parseFloat(totalInput.value) || 0;
      const qty = parseInt(qtyInput.value, 10) || 0;
      if (total > 0 && qty > 0) {
        const costPerUnit = total / qty;
        const profitPerUnit = p.selling_price - costPerUnit;
        const totalProfit = profitPerUnit * qty;
        calcBox.classList.remove('hidden');
        calcBox.innerHTML = `
          <p>ต้นทุนต่อชิ้น: <span class="font-display font-semibold tnum">฿${fmtMoney(costPerUnit)}</span></p>
          <p>กำไรต่อชิ้น: <span class="font-display font-semibold tnum ${profitPerUnit >= 0 ? '' : 'text-danger'}">฿${fmtMoney(profitPerUnit)}</span></p>
          <p>กำไรรวมล็อตนี้ (${qty} ชิ้น): <span class="font-display font-semibold tnum ${totalProfit >= 0 ? '' : 'text-danger'}">฿${fmtMoney(totalProfit)}</span></p>
        `;
      } else {
        calcBox.classList.add('hidden');
      }
    }
    totalInput.addEventListener('input', update);
    qtyInput.addEventListener('input', update);
    body.querySelector(`[data-rc-save="${p.id}"]`).onclick = async () => {
      const total = parseFloat(totalInput.value);
      const qty = parseInt(qtyInput.value, 10);
      if (!total || !qty) return toast('กรอกราคาต้นทุนรวมและจำนวนให้ครบ', 'error');
      await DB.addStockBatch(p.id, total / qty, qty);
      toast('บันทึกต้นทุนล็อตใหม่สำเร็จ ✓', 'success');
      go('inventory', { tab: 'products' });
    };
  });
}

            </div>
          </div>`).join('')}
      </div>
    `;

      if (btn.disabled) return;
      btn.disabled = true;
      try {

        <button id="add-product" class="press w-full bg-primary text-white py-2.5 rounded-xl font-medium text-sm">เพิ่มสินค้า</button>
      </div>
      <div class="space-y-2" id="product-list">
        ${products.map(p => productRowHtml(p)).join('')}

      const costTotal = parseFloat(body.querySelector('#p-cost-total').value) || 0;
      const qty = parseInt(body.querySelector('#p-cost-qty').value, 10) || 0;

        const costPerUnit = costTotal / qty;
        const profitPerUnit = price - costPerUnit;

        calcBox.classList.remove('hidden');
        calcBox.innerHTML = `
          <p>ต้นทุนต่อชิ้น: <span class="font-display font-semibold tnum">฿${fmtMoney(costPerUnit)}</span></p>
          <p>กำไรต่อชิ้น: <span class="font-display font-semibold tnum ${profitPerUnit >= 0 ? 'text-primary' : 'text-danger'}">฿${fmtMoney(profitPerUnit)}</span></p>

      toast('จัดวางสินค้าสำเร็จ ✓', 'success');
    };
  }
}

          <div class="flex-1">
            <label class="text-xs text-muted mb-1 block">ต้นทุนต่อชิ้น</label>
            <input id="rv-cost" type="number" inputmode="decimal" placeholder="เช่น 8.2" class="w-full text-sm bg-bg rounded-xl px-3 py-2.5 outline-none">
          </div>
          <div class="flex-1">
            <label class="text-xs text-muted mb-1 block">กำไรที่ต้องการ (%)</label>
            <input id="rv-margin" type="number" inputmode="decimal" placeholder="เช่น 50" class="w-full text-sm bg-bg rounded-xl px-3 py-2.5 outline-none">
          </div>
        </div>
        <div id="rv-result" class="hidden bg-accent-light rounded-xl p-3 text-sm text-accent-dark">
          ควรตั้งราคาขายที่ <span class="font-display font-semibold tnum" id="rv-price">-</span> ต่อชิ้น
        </div>
      </div>
    </details>

    ${scratch.length > 0 ? `
    <div class="flex items-center justify-between mb-2">
      <h2 class="font-display font-semibold text-base">รายการเปรียบเทียบ (${scratch.length})</h2>
      <button id="c-clear-all" class="press text-xs text-danger font-medium">ล้างทั้งหมด</button>
    </div>
    <div id="c-scratch-list" class="space-y-2 mb-4"></div>
    <div class="bg-ink text-white rounded-2xl p-4 flex items-center justify-between mb-6">
      <div>
        <p class="text-xs text-white/60">รวมเงินลงทุนทั้งหมด</p>
        <p class="font-display font-semibold text-lg tnum" id="c-sum-cost">-</p>
      </div>
      <div class="text-right">
        <p class="text-xs text-white/60">รวมกำไรที่คาดว่าจะได้</p>
        <p class="font-display font-semibold text-lg tnum text-success" id="c-sum-profit">-</p>
      </div>
    </div>` : ''}
  `;

  root.querySelector('#calc-back').onclick = () => go(state.from === 'inventory' ? 'inventory' : 'dashboard');

  const priceEl = root.querySelector('#c-price');
  const totalEl = root.querySelector('#c-cost-total');
  const qtyEl = root.querySelector('#c-qty');
  const resultBox = root.querySelector('#c-result');
  const addBtn = root.querySelector('#c-add');

  let lastCalc = null;
  function computeAndRender() {
    const price = parseFloat(priceEl.value) || 0;
    const total = parseFloat(totalEl.value) || 0;
    const qty = parseInt(qtyEl.value, 10) || 0;
    if (total > 0 && qty > 0 && price >= 0) {
      const costUnit = total / qty;
      const profitUnit = price - costUnit;
      const markup = costUnit > 0 ? (profitUnit / costUnit) * 100 : 0;
      const margin = price > 0 ? (profitUnit / price) * 100 : 0;
      const totalProfit = profitUnit * qty;
      lastCalc = { price, total, qty, costUnit, profitUnit, totalProfit };

      resultBox.classList.remove('hidden');
      root.querySelector('#r-cost-unit').textContent = `฿${fmtMoney(costUnit)}`;
      const profitColor = profitUnit >= 0 ? 'text-primary' : 'text-danger';
      const profitEl = root.querySelector('#r-profit-unit'); profitEl.textContent = `฿${fmtMoney(profitUnit)}`; profitEl.className = `font-display font-semibold text-lg tnum ${profitColor}`;
      root.querySelector('#r-markup').textContent = `${fmtMoney(markup)}%`;
      root.querySelector('#r-margin').textContent = `${fmtMoney(margin)}%`;
      const totalEl2 = root.querySelector('#r-total-profit'); totalEl2.textContent = `฿${fmtMoney(totalProfit)}`; totalEl2.className = `font-display font-semibold text-2xl tnum ${profitUnit >= 0 ? 'text-primary' : 'text-danger'}`;
      addBtn.disabled = false;
      root.querySelector('#rv-cost').value = costUnit.toFixed(2);
    } else {
      resultBox.classList.add('hidden');
      addBtn.disabled = true;
      lastCalc = null;
    }
  }
  [priceEl, totalEl, qtyEl].forEach(el => el.addEventListener('input', computeAndRender));

  root.querySelector('#c-clear').onclick = () => {
    root.querySelector('#c-name').value = '';
    priceEl.value = ''; totalEl.value = ''; qtyEl.value = '';
    computeAndRender();
  };

  addBtn.onclick = () => {
    if (!lastCalc) return;
    const name = root.querySelector('#c-name').value.trim() || 'สินค้าไม่มีชื่อ';
    scratch.push({ id: uid('calc'), name, ...lastCalc });
    saveCalcScratch(scratch);
    toast('เพิ่มลงรายการเปรียบเทียบแล้ว ✓', 'success');
    go('calculator', state);
  };

  // reverse calculator: desired margin over cost -> suggested price
  const rvCost = root.querySelector('#rv-cost');
  const rvMargin = root.querySelector('#rv-margin');
  const rvResult = root.querySelector('#rv-result');
  function computeReverse() {
    const cost = parseFloat(rvCost.value) || 0;
    const marginPct = parseFloat(rvMargin.value);
    if (cost > 0 && !isNaN(marginPct)) {
      const suggested = cost * (1 + marginPct / 100);
      rvResult.classList.remove('hidden');
      root.querySelector('#rv-price').textContent = `฿${fmtMoney(suggested)}`;
    } else {
      rvResult.classList.add('hidden');
    }
  }
  rvCost.addEventListener('input', computeReverse);
  rvMargin.addEventListener('input', computeReverse);

  // scratch list
  if (scratch.length > 0) {
    const listEl = root.querySelector('#c-scratch-list');
    listEl.innerHTML = scratch.map(s => `
      <div class="bg-surface border border-hairline rounded-xl px-4 py-3 flex items-center justify-between">
        <div class="min-w-0">
          <p class="text-sm font-medium truncate">${s.name}</p>
          <p class="text-xs text-muted">ทุน ฿${fmtMoney(s.costUnit)}/ชิ้น · ${s.qty} ชิ้น · รวม ฿${fmtMoney(s.total)}</p>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <span class="font-display font-semibold text-sm tnum ${s.profitUnit >= 0 ? 'text-primary' : 'text-danger'}">+฿${fmtMoney(s.totalProfit)}</span>
          <button data-del-calc="${s.id}" class="press w-7 h-7 rounded-full bg-danger-light text-danger flex items-center justify-center text-sm">×</button>
        </div>
      </div>`).join('');
    listEl.querySelectorAll('[data-del-calc]').forEach(btn => btn.onclick = () => {
      scratch = scratch.filter(s => s.id !== btn.dataset.delCalc);
      saveCalcScratch(scratch);
      go('calculator', state);
    });
    const sumCost = scratch.reduce((s, x) => s + x.total, 0);
    const sumProfit = scratch.reduce((s, x) => s + x.totalProfit, 0);
    root.querySelector('#c-sum-cost').textContent = `฿${fmtMoney(sumCost)}`;
    root.querySelector('#c-sum-profit').textContent = `฿${fmtMoney(sumProfit)}`;
    root.querySelector('#c-clear-all').onclick = () => {
      scratch = [];
      saveCalcScratch(scratch);
      go('calculator', state);
    };
  }
}

/* ============================================================
   12) INIT
   ============================================================ */
if (!CONFIGURED) {
  document.getElementById('app').innerHTML = `
    <div class="bg-danger-light border border-danger/30 text-danger rounded-2xl p-4 text-sm">
      ยังไม่ได้ตั้งค่า Supabase — กรุณาใส่ค่า <b>SUPABASE_URL</b> และ <b>SUPABASE_ANON_KEY</b>
      ที่ด้านบนของไฟล์ก่อนใช้งานจริง
    </div>`;
  toast('ยังไม่ได้ตั้งค่า Supabase', 'error');
} else {
  updateNetBadge();
  go('dashboard');
  if (navigator.onLine) syncQueue();
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
