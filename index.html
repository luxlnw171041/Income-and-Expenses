<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>เมียที่สวยที่สุดในโลกกก
  </title>
  <meta name="theme-color" content="#145C52">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Sarabun:wght@400;500;600&display=swap"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: '#F5F7F1',
            surface: '#FFFFFF',
            primary: { DEFAULT: '#145C52', dark: '#0E453D', light: '#E4EFEA' },
            accent: { DEFAULT: '#F2A33C', dark: '#D98A22', light: '#FCEBD1' },
            danger: { DEFAULT: '#D9483F', light: '#FBE4E2' },
            success: { DEFAULT: '#3FA34D', light: '#E4F5E7' },
            ink: '#1B2420',
            muted: '#6B7770',
            hairline: '#E4E7E0',
          },
          fontFamily: {
            display: ['Kanit', 'sans-serif'],
            body: ['Sarabun', 'sans-serif'],
          },
          borderRadius: { '2xl': '1.25rem', '3xl': '1.75rem' },

      }

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      overscroll-behavior-y: none;
    }

    body {
      font-family: 'Sarabun', sans-serif;
      background: #F5F7F1;
      color: #1B2420;
    }

    .font-display {
      font-family: 'Kanit', sans-serif;
    }

    .tnum {
      font-variant-numeric: tabular-nums;
    }

    /* page transitions */
    .screen {
      animation: fadeSlideIn .28s cubic-bezier(.22, .9, .32, 1) both;
    }

    @keyframes fadeSlideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    /* press feedback */
    .press {
      transition: transform .12s ease, opacity .12s ease;
    }

    .press:active {
      transform: scale(0.94);
      opacity: .85;
    }

    /* badge pop */
    .pop-in {
      animation: popIn .32s cubic-bezier(.34, 1.56, .64, 1) both;
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: scale(.5) translateY(4px);
      }

      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    /* toast */
    #toast-wrap {
      position: fixed;
      top: max(env(safe-area-inset-top), 12px);
      left: 0;
      right: 0;
      z-index: 60;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }

    .toast {
      pointer-events: auto;
      animation: toastIn .35s cubic-bezier(.22, .9, .32, 1) both;
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateY(-16px) scale(.96);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .toast.out {
      animation: toastOut .25s ease forwards;
    }

    @keyframes toastOut {
      to {
        opacity: 0;
        transform: translateY(-10px) scale(.97);
      }
    }

    /* skeleton shimmer */
    .shimmer {
      background: linear-gradient(90deg, #ECEFE8 25%, #F5F7F1 37%, #ECEFE8 63%);
      background-size: 400% 100%;
      animation: shimmer 1.4s ease infinite;
    }

    @keyframes shimmer {
      0% {
        background-position: 100% 0;
      }

      100% {
        background-position: 0 0;
      }
    }

    /* shelf tag: dashed perforation, signature element */
    .shelf-tag {
      position: relative;
    }

    .shelf-tag::before {
      content: '';
      position: absolute;
      left: 14px;
      right: 14px;
      top: 0;
      border-top: 2px dashed #D8DED2;
    }

    .shelf-tag .notch {
      position: absolute;
      top: -9px;
      width: 18px;
      height: 18px;
      border-radius: 9999px;
      background: #F5F7F1;
      border: 2px solid #D8DED2;
    }

    /* count-up number */
    .count-num {
      transition: opacity .2s ease;
    }

    /* nav */
    .navbtn {
      transition: color .2s ease, transform .15s ease;
    }

    .navbtn.active {
      color: #145C52;
    }

    .navbtn .dot {
      transition: transform .25s cubic-bezier(.34, 1.56, .64, 1), opacity .2s ease;
    }

    /* offline pulse */
    .pulse-dot {
      animation: pulseDot 1.6s ease-in-out infinite;
    }

    @keyframes pulseDot {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: .35;
      }
    }

    /* switch */
    .seg-thumb {
      transition: transform .25s cubic-bezier(.22, .9, .32, 1);
    }

    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input[type=number] {
      -moz-appearance: textfield;
    }

    ::selection {
      background: #F2A33C;
      color: #fff;
    }
  </style>
</head>

<body class="antialiased">

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    /* ============================================================
       1) CONFIG — ใส่ค่า Supabase ของคุณตรงนี้ (ระบบใช้ Supabase จริงเท่านั้น
       ไม่มี Mock Mode แล้ว ต้องตั้งค่าให้ครบก่อนใช้งาน)
       ============================================================ */
    const SUPABASE_URL = 'https://dfemavcrzpmmgqqjrxvz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmZW1hdmNyenBtbWdxcWpyeHZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2ODY4NTEsImV4cCI6MjEwMTI2Mjg1MX0.JYsRkjRwbAqKxqB9MT5iMDOeh5zh087sWmKo_Jx1cbc';

    const CONFIGURED = !SUPABASE_URL.includes('SUPABASE_URL') && !!SUPABASE_ANON_KEY && !SUPABASE_ANON_KEY.includes('YOUR_SUPABASE');
    const supabase = CONFIGURED ? createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    /* ============================================================
       2) TOAST
       ============================================================ */
    function toast(msg, kind = 'info') {
      const wrap = document.getElementById('toast-wrap');
      const el = document.createElement('div');
      const styles = {
        info: 'bg-ink text-white',
        success: 'bg-success text-white',
        error: 'bg-danger text-white',
        offline: 'bg-accent text-white',
      };
      el.className = `toast ${styles[kind] || styles.info} text-sm font-medium px-4 py-2.5 rounded-full shadow-lg max-w-[90%] text-center`;
      el.textContent = msg;
      wrap.appendChild(el);
      setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 250); }, 2600);
    }

    /* ============================================================
       3) OFFLINE QUEUE (localStorage) + AUTO SYNC
       ============================================================ */
    const QUEUE_KEY = 'pending_stock_sync';

    function getQueue() { try { return JSON.parse(localStorage.getItem(QUEUE_KEY)) || []; } catch { return []; } }
    function setQueue(q) { localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); updateNetBadge(); }
    function pushToQueue(item) { const q = getQueue(); q.push({ ...item, queued_at: Date.now() }); setQueue(q); }

   async function syncQueue() {
      if (!navigator.onLine) return;
      let q = getQueue();
      if (q.length === 0) return;
      
      toast(`กำลังซิงค์ข้อมูล ${q.length} รายการ...`, 'info');
      let successCount = 0;
      
      while (q.length > 0) {
        const item = q[0];
        try {
          await DB.processStockAudit(item.payload, true);
          q.shift(); // ทำสำเร็จ ลบออกจากคิว
          successCount++;
          setQueue(q);
        } catch (e) {
          console.error('sync failed', e);
          // หากเป็น Error ที่เกิดจาก Network (เน็ตหลุดกลางคัน) ให้หยุดรอรอบหน้า
          if (e.message.toLowerCase().includes('fetch') || e.message.toLowerCase().includes('network')) {
            break; 
          } else {
            // หากเป็น Error จากข้อมูลพัง (เซิร์ฟเวอร์ปฏิเสธ) ให้ทิ้งรายการนี้ไปเลย คิวจะได้ไม่ตัน
            q.shift(); 
            setQueue(q);
            toast(`ข้ามรายการที่มีปัญหา: ${item.payload.product_name}`, 'error');
          }
        }
      }
      
      if (getQueue().length === 0) {
        toast('ซิงค์ข้อมูลสำเร็จทั้งหมด ✓', 'success');
      } else if (successCount > 0) {
        toast(`ซิงค์สำเร็จ ${successCount} รายการ (เหลือรอซิงค์ ${getQueue().length})`, 'info');
      }
      refreshCurrentRoute();
    }

    window.addEventListener('online', () => { updateNetBadge(); syncQueue(); });
    window.addEventListener('offline', updateNetBadge);

    function updateNetBadge() {
      const dot = document.getElementById('net-dot');
      const label = document.getElementById('net-label');
      const badge = document.getElementById('net-badge');
      const pending = getQueue().length;
      if (navigator.onLine) {
        badge.className = 'flex items-center gap-1.5 text-xs font-medium px-2.5 py-1 rounded-full border border-success/30 bg-success-light text-success';
        dot.className = 'w-2 h-2 rounded-full bg-success';
        label.textContent = pending > 0 ? `ออนไลน์ · ซิงค์ ${pending}` : 'ออนไลน์';
      } else {
        badge.className = 'flex items-center gap-1.5 text-xs font-medium px-2.5 py-1 rounded-full border border-danger/30 bg-danger-light text-danger';
        dot.className = 'w-2 h-2 rounded-full bg-danger pulse-dot';
        label.textContent = pending > 0 ? `ออฟไลน์ · รอ ${pending}` : 'ออฟไลน์';
      }
    }

    /* ============================================================
       4) uid() — small local id generator, still used by the standalone
       cost/profit calculator's scratch list (section 11), which is
       intentionally local-only and never touches Supabase.
       ============================================================ */
    function uid(p) { return p + '_' + Math.random().toString(36).slice(2, 9); }

    /* ============================================================
       ฟังก์ชันป้องกัน UI พังจากการพิมพ์อักขระพิเศษ
       ============================================================ */
    function escapeHTML(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
    /* ============================================================
       5) DATA ACCESS LAYER — Supabase only
       ============================================================ */
    const DB = {
      async getBuildings() {
        const { data, error } = await supabase.from('buildings').select('*').order('name');
        if (error) throw error; return data;
      },
      async getShelves(buildingId) {
        const { data, error } = await supabase.from('shelves').select('*').eq('building_id', buildingId).order('floor');
        if (error) throw error; return data;
      },
      async getShelfItems(shelfId) {
        // NOTE: previously this used a single query with an invalid double-nested
        // embed (`stock_batches:products(stock_batches(...))`), which does not
        // describe a real foreign-key path and returned undefined/empty data —
        // so cost_price (and therefore the loss value shown while counting stock)
        // silently resolved to 0 for every item. Fixed by fetching the shelf
        // items and the latest cost per product in two simple, correct queries.
        const { data: rows, error } = await supabase
          .from('product_shelves')
          .select('id, quantity, product:products(id,name,selling_price,image_url,min_stock_alert)')
          .eq('shelf_id', shelfId);
        if (error) throw error;
        if (rows.length === 0) return [];

        const productIds = rows.map(r => r.product.id);
        const { data: batches, error: bErr } = await supabase
          .from('stock_batches')
          .select('product_id, cost_price, created_at')
          .in('product_id', productIds)
          // แก้ไข: เพิ่มการ sort ด้วย id เพื่อให้ผลลัพธ์ไม่คลาดเคลื่อน
          .order('created_at', { ascending: false })
          .order('id', { ascending: false });
        if (bErr) throw bErr;

        const latestCostByProduct = {};
        for (const b of batches) {
          if (!(b.product_id in latestCostByProduct)) latestCostByProduct[b.product_id] = b.cost_price;
        }
        return rows.map(row => ({
          id: row.id, quantity: row.quantity, product: row.product,
          cost_price: latestCostByProduct[row.product.id] ?? 0,
        }));
      },
      async processStockAudit(payload, fromQueue = false) {
        // payload: { product_shelf_id, expected_qty, actual_qty, cost_price, product_name, account_id, reason }
        const { data, error } = await supabase.rpc('process_stock_audit', {
          p_product_shelf_id: payload.product_shelf_id,
          p_actual_qty: payload.actual_qty,
          p_reason: payload.reason || null,             // ส่งค่าเหตุผล
          p_account_id: payload.account_id || null      // ส่ง ID กระเป๋าเพื่อหักเงิน Loss
        });
        if (error) throw error;
        return data;
      },
      async getDashboardOverview() {
        const { data, error } = await supabase.from('view_dashboard_overview').select('*').single();
        if (error) throw error; return data;
      },
      async getLowStockAlerts() {
        const { data, error } = await supabase.from('view_low_stock_alerts').select('*');
        if (error) throw error; return data;
      },
      async getAccounts() {
        const { data, error } = await supabase.from('accounts').select('*').order('type');
        if (error) throw error; 
        
        // ล็อคตำแหน่ง: ดันบัญชีที่มีคำว่า "เงินสด" ขึ้นมาเป็นอันดับแรกเสมอ
        return data.sort((a, b) => {
          const aIsCash = a.name.includes('เงินสด');
          const bIsCash = b.name.includes('เงินสด');
          if (aIsCash && !bIsCash) return -1; // a มาก่อน
          if (!aIsCash && bIsCash) return 1;  // b มาก่อน
          return a.name.localeCompare(b.name, 'th'); // ที่เหลือเรียงตามตัวอักษร
        });
      },
      async addTransaction({ account_id, type, category, amount, note }) {
        const { data, error } = await supabase.rpc('add_transaction', { p_account_id: account_id, p_type: type, p_category: category, p_amount: amount, p_note: note || null });
        if (error) throw error; return data;
      },
      async getRecentTransactions(limit = 8) {
        const { data, error } = await supabase.from('transactions').select('*').order('created_at', { ascending: false }).limit(limit);
        if (error) throw error; return data;
      },
      async addBuilding(name) {
        const { data, error } = await supabase.from('buildings').insert({ name }).select().single();
        if (error) throw error; return data;
      },
      async addShelf(building_id, floor) {
        const { data, error } = await supabase.from('shelves').insert({ building_id, floor }).select().single();
        if (error) throw error; return data;
      },
      async updateBuilding(id, name) {
      const { data, error } = await supabase.from('buildings').update({ name }).eq('id', id).select().single();
      if (error) throw error; return data;
        },
      async deleteBuilding(id) {
        const { error } = await supabase.from('buildings').delete().eq('id', id);
        if (error) throw error;
      },
      async deleteShelf(id) {
        const { error } = await supabase.from('shelves').delete().eq('id', id);
        if (error) throw error;
      },
      async addProduct(p) {
        const { data, error } = await supabase.from('products').insert(p).select().single();
        if (error) throw error; return data;
      },
      async getProducts() {
        const { data, error } = await supabase.from('products').select('*').order('name');
        if (error) throw error; return data;
      },
      async addStockBatch(product_id, cost_price, qty, account_id) {
        const { data, error } = await supabase.from('stock_batches').insert({ product_id, cost_price, initial_qty: qty, remaining_qty: qty }).select().single();
        if (error) throw error;
        if (account_id) {
          await this.addTransaction({
            account_id,
            type: 'expense',
            category: 'ซื้อสินค้าเข้าสต็อก',
            amount: cost_price * qty,
            note: null
          });
        }
        return data;
      },async executeTransfer({ from_acc, to_acc, amount, note, from_name, to_name }) {
        const { error } = await supabase.rpc('execute_transfer', {
          p_from_acc: from_acc, p_to_acc: to_acc, p_amount: amount, p_note: note || null, p_from_name: from_name, p_to_name: to_name
        });
        if (error) throw error;
      },
      async getProductsWithCost() {
    const { data: products, error } = await supabase.from('products').select('*').order('name');
    
    if (error) throw error;
    
   // แก้ไข: เพิ่มการ sort ด้วย id
const { data: batches, error: bErr } = await supabase
  .from('stock_batches')
  .select('*')
  .order('created_at', { ascending: true })
  .order('id', { ascending: true });
    if (bErr) throw bErr;
    
    const batchesByProduct = {};
    for (const b of batches) (batchesByProduct[b.product_id] ??= []).push(b);
    
    return products.map(p => {
      const pBatches = batchesByProduct[p.id] || [];
      const latest = pBatches[pBatches.length - 1];
      
      // รวมยอดคงเหลือจากทุกๆ ล็อตการซื้อ (Batches) ที่ถูกหักลบอัตโนมัติจากหลังบ้านแล้ว
      const remaining_units = pBatches.reduce((sum, b) => sum + b.remaining_qty, 0);
      
      return { ...p, cost_price: latest ? latest.cost_price : null, remaining_units };
    });
  },
     async assignProductToShelf(shelf_id, product_id, quantity) {
    // เปลี่ยนจาก .upsert() ไปเป็นการเรียกใช้ RPC ที่เราเพิ่งสร้างใหม่เพื่อให้มันช่วยเช็คจำนวน
    const { data, error } = await supabase.rpc('assign_product_to_shelf', {
      p_shelf_id: shelf_id,
      p_product_id: product_id,
      p_qty: quantity
    });
    if (error) throw error; 
    return data;
  },async decrementShelfItem(productShelfId, productId, qtyToRemove) {
  // ลดจำนวนบนชั้น แล้วคืนของกลับเข้าล็อตสต็อกล่าสุดของสินค้านั้น
  const { data: row, error: e1 } = await supabase
    .from('product_shelves').select('quantity').eq('id', productShelfId).single();
  if (e1) throw e1;

  const newQty = Math.max(0, row.quantity - qtyToRemove);
  const { error: e2 } = await supabase
    .from('product_shelves').update({ quantity: newQty }).eq('id', productShelfId);
  if (e2) throw e2;

  const { data: batch, error: e3 } = await supabase
    .from('stock_batches').select('id, remaining_qty').eq('product_id', productId)
    .order('created_at', { ascending: false }).order('id', { ascending: false })
    .limit(1).maybeSingle();
  if (e3) throw e3;
  if (batch) {
    const { error: e4 } = await supabase
      .from('stock_batches').update({ remaining_qty: batch.remaining_qty + qtyToRemove }).eq('id', batch.id);
    if (e4) throw e4;
  }
  return newQty;
},
async removeShelfItem(productShelfId, productId, qty) {
  if (qty > 0) await this.decrementShelfItem(productShelfId, productId, qty);
  const { error } = await supabase.from('product_shelves').delete().eq('id', productShelfId);
  if (error) throw error;
},

      },// เพิ่มต่อท้ายในออบเจ็กต์ DB 
      async getAllTransactions(timeRange = 'month') {
        let query = supabase.from('transactions').select('*').order('created_at', { ascending: false });
        if (timeRange !== 'all') {
          const now = new Date();
          let past = new Date();
          if (timeRange === 'day') {
            past.setHours(0, 0, 0, 0);
          } else if (timeRange === 'week') {
            past.setDate(now.getDate() - 7);
          } else if (timeRange === 'month') {
            past.setMonth(now.getMonth() - 1); // ย้อนหลัง 1 เดือน
          }
          query = query.gte('created_at', past.toISOString());
        }
        const { data, error } = await query;
        if (error) throw error;
        return data;
      },
      async getReconciliationData() {
  // 1. ดึงเวลาปิดยอดล่าสุด
  const { data: settings } = await supabase.from('shop_settings').select('last_reconciled_at').eq('id', 1).single();
  
  // แก้ไข: ถ้าไม่เคยปิดยอดเลย ให้ใช้วันปัจจุบันเป็นจุดเริ่มต้น แทนที่จะเป็น Epoch (ปี 1970)
  const lastReconciled = settings?.last_reconciled_at || new Date().toISOString(); 

  // 2. ดึงข้อมูลของหาย (เพิ่มการ select 'reason' มาด้วย)
  const { data: discrepancies } = await supabase.from('stock_discrepancies')
    .select('value_at_selling_price, reason') 
    .is('resolved_as', null)
    .lt('diff_qty', 0);

  // แก้ไข: รวมยอดเฉพาะเหตุผลที่ทำให้เสียรายได้เท่านั้น (ไม่รวมชำรุด/หมดอายุ)
  let totalLostValue = 0;
  if (discrepancies) {
    const revenueLostDiscrepancies = discrepancies.filter(d => 
      d.reason === 'สูญหาย/ไม่ทราบสาเหตุ' || d.reason === 'นำไปใช้ส่วนตัว'
    );
    totalLostValue = revenueLostDiscrepancies.reduce((s, row) => s + row.value_at_selling_price, 0);
  }

  // 3. ดึงรวม "รายรับของร้านค้า" ตั้งแต่ปิดยอดรอบที่แล้ว
  const accounts = await this.getAccounts();
  const businessAccIds = accounts.filter(a => a.type === 'business').map(a => a.id);
  
  const { data: incomeTxs } = await supabase.from('transactions')
    .select('amount')
    .in('account_id', businessAccIds)
    .eq('type', 'income')
    .not('category', 'in', '("เงินทุน/เงินทอน","รายได้อื่น")')
    .gt('created_at', lastReconciled);
    
  const totalActualIncome = incomeTxs ? incomeTxs.reduce((s, row) => s + row.amount, 0) : 0;

  return { 
    lastReconciled, 
    expectedSales: totalLostValue, 
    actualIncome: totalActualIncome,
    unexplainedDiff: totalLostValue - totalActualIncome 
  };
},

    function bindItemCard(root, id) {
      const input = root.querySelector(`[data-input="${id}"]`);
      const minus = root.querySelector(`[data-minus="${id}"]`);
      const plus = root.querySelector(`[data-plus="${id}"]`);
      const diffEl = root.querySelector(`[data-diff="${id}"]`);

      function setVal(v) {
        v = Math.max(0, v);
        input.value = v;
        countCart[id].actual = v;
        updateDiff();
      }
      function updateDiff() {
        const diff = countCart[id].actual - countCart[id].expected;
        diffEl.classList.remove('pop-in'); void diffEl.offsetWidth; diffEl.classList.add('pop-in');
        if (diff < 0) {
          const loss = Math.abs(diff) * countCart[id].cost_price;
          diffEl.className = 'pop-in text-xs font-display font-semibold px-2 py-1 rounded-full bg-danger-light text-danger tnum';
          diffEl.textContent = `${diff} ชิ้น (ขาดทุน ฿${fmtMoney(loss)})`;
        } else if (diff > 0) {
          diffEl.className = 'pop-in text-xs font-display font-semibold px-2 py-1 rounded-full bg-success-light text-success tnum';
          diffEl.textContent = `+${diff} ชิ้น`;
        } else {
          diffEl.className = 'pop-in text-xs font-display font-semibold px-2 py-1 rounded-full bg-hairline text-muted tnum';
          diffEl.textContent = '0';
        }
      }

      input.addEventListener('input', () => setVal(parseInt(input.value || '0', 10)));

      function holdRepeat(btn, delta) {
        let interval, timeout;
        const start = (e) => {
          e.preventDefault();
          setVal(countCart[id].actual + delta);
          timeout = setTimeout(() => { interval = setInterval(() => setVal(countCart[id].actual + delta), 90); }, 400);
        };
        const stop = () => { clearTimeout(timeout); clearInterval(interval); };
        btn.addEventListener('pointerdown', start);
        ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => btn.addEventListener(ev, stop));
      }
      holdRepeat(minus, -1);
      holdRepeat(plus, 1);
    }

    async function saveAudit(root, state) {
  const btn = root.querySelector('#save-audit');
  const entries = Object.entries(countCart);
  const accounts = await DB.getAccounts().catch(() => []);
  const businessAccount = accounts.find(a => a.type === 'business') || accounts[0];

  // ค้นหารายการที่ "ของหาย" (actual < expected)
  const lostItems = entries.filter(([psId, c]) => c.actual < c.expected);

  // ฟังก์ชันตัวบันทึกข้อมูลหลัก
  const executeSave = async (reasonPayloads = {}) => {
    btn.disabled = true;
    btn.innerHTML = `<span class="animate-spin inline-block w-5 h-5 border-2 border-white/40 border-t-white rounded-full"></span>`;
    
    let hasError = false;
    let errorMessage = '';

    const results = await Promise.allSettled(entries.map(async ([psId, c]) => {
      const payload = {
        product_shelf_id: psId, expected_qty: c.expected, actual_qty: c.actual,
        cost_price: c.cost_price, product_name: c.product.name, account_id: businessAccount?.id,
        reason: reasonPayloads[psId] || null
      };
      
      // 1. ถ้าไม่มีเน็ต (แบบออฟไลน์จริงๆ) ให้ลงคิว
      if (!navigator.onLine) { 
        pushToQueue({ payload }); 
        return 'offline'; 
      }
      
      // 2. ถ้ามีเน็ต ให้ยิงเข้าฐานข้อมูลตรงๆ ทันที
      try {
        await DB.processStockAudit(payload);
        return 'ok';
      } catch (e) {
        console.error('API Error:', e);
        hasError = true;
        errorMessage = e.message;
        throw e; // ดัน Error ออกไปให้ระบบรู้ว่าล้มเหลว
      }
    }));
    
    const okCount = results.filter(r => r.status === 'fulfilled' && r.value === 'ok').length;
    const offlineCount = results.filter(r => r.status === 'fulfilled' && r.value === 'offline').length;
    const errCount = results.filter(r => r.status === 'rejected').length;

    updateNetBadge();
    
    // ถ้าพัง แจ้งเตือน Error ให้ผู้ใช้เห็นชัดๆ (ไม่แอบโยนเข้าคิวแล้ว)
    if (errCount > 0) {
      toast(`เกิดข้อผิดพลาด ${errCount} รายการ: ${errorMessage}`, 'error');
      btn.disabled = false;
      btn.textContent = 'บันทึกการนับสต็อก';
      return; 
    }

    if (offlineCount > 0 && okCount === 0) toast(`บันทึกในเครื่องแล้ว (รอซิงค์)`, 'offline');
    else if (offlineCount > 0) toast(`บันทึกแล้ว ${okCount} รายการ, รอซิงค์ ${offlineCount}`, 'info');
    else toast('บันทึกการนับสต็อกสำเร็จ ✓', 'success');
    
    go('dashboard');
  };

  // ถ้ามีของหาย ให้เด้ง Modal ถามสาเหตุ
  if (lostItems.length > 0) {
    const modalWrap = document.createElement('div');
    modalWrap.className = 'fixed inset-0 z-[60] bg-ink/40 backdrop-blur-sm flex flex-col justify-end p-4 screen';
    modalWrap.innerHTML = `
      <div class="bg-surface rounded-3xl p-5 w-full max-w-md mx-auto shadow-2xl pop-in">
        <h3 class="font-display font-semibold text-lg text-danger mb-1">พบสินค้าขาดหาย ${lostItems.length} รายการ</h3>
        <p class="text-xs text-muted mb-4">โปรดระบุสาเหตุ เพื่อให้ระบบลงบันทึกค่าใช้จ่ายได้ถูกต้อง</p>
        <div class="max-h-[50vh] overflow-y-auto space-y-3 mb-4">
          ${lostItems.map(([psId, c]) => `
            <div class="bg-bg rounded-xl p-3 border border-hairline">
              <p class="text-sm font-medium mb-1">${c.product.name} <span class="text-danger">(หาย ${c.expected - c.actual} ชิ้น)</span></p>
              <select data-reason-id="${psId}" class="w-full text-sm bg-surface rounded-lg px-2 py-2 outline-none border border-hairline">
                <option value="สูญหาย/ไม่ทราบสาเหตุ">❓ สูญหาย/ไม่ทราบสาเหตุ</option>
                <option value="สินค้าชำรุด/แตกหัก">💥 สินค้าชำรุด/แตกหัก</option>
                <option value="หมดอายุ">⏳ สินค้าหมดอายุ</option>
                <option value="นำไปใช้ส่วนตัว">👤 นำไปใช้ส่วนตัว</option>
              </select>
            </div>
          `).join('')}
        </div>
        <div class="flex gap-2">
          <button id="cancel-reason" class="press flex-1 py-3 bg-hairline text-ink rounded-xl font-medium text-sm">ยกเลิก</button>
          <button id="confirm-reason" class="press flex-[2] py-3 bg-danger text-white rounded-xl font-medium text-sm">ยืนยันและบันทึก</button>
        </div>
      </div>
    `;
    document.body.appendChild(modalWrap);

    modalWrap.querySelector('#cancel-reason').onclick = () => modalWrap.remove();
    modalWrap.querySelector('#confirm-reason').onclick = () => {
      const reasons = {};
      modalWrap.querySelectorAll('[data-reason-id]').forEach(sel => {
        reasons[sel.dataset.reasonId] = sel.value;
      });
      modalWrap.remove();
      executeSave(reasons);
    };
  } else {
    // ถ้าของไม่หาย กดเซฟได้เลย
    executeSave();
  }
}

      const seg = root.querySelector('#seg-thumb');
      const saveBtnTheme = root.querySelector('#tx-save');

      // สลับแท็บ รายจ่าย / รายรับ / โอนเงิน
      root.querySelectorAll('[data-type]').forEach(btn => btn.onclick = () => {
        txType = btn.dataset.type;

        const idx = ['expense', 'income', 'transfer'].indexOf(txType);
        seg.style.transform = `translateX(${idx * 100}%)`;

        let themeColor = 'bg-danger';
        if (txType === 'income') themeColor = 'bg-success';
        if (txType === 'transfer') themeColor = 'bg-primary';

        seg.className = `seg-thumb absolute top-1 bottom-1 w-1/3 rounded-full ${themeColor}`;
        saveBtnTheme.className = `press w-full text-white font-display font-medium py-3.5 rounded-2xl transition-colors ${themeColor}`;
        saveBtnTheme.textContent = txType === 'transfer' ? 'ยืนยันการโอนเงิน' : 'บันทึกรายการ';

        root.querySelectorAll('[data-type]').forEach(b => {
          b.classList.remove('text-white');
          b.classList.add('text-ink');
        });
        btn.classList.remove('text-ink');
        btn.classList.add('text-white');

        // ซ่อน-โชว์ ฟิลด์ตามประเภท
        if (txType === 'transfer') {
          root.querySelector('#normal-tx-fields').classList.add('hidden');
          root.querySelector('#quick-cats-section').classList.add('hidden');
          root.querySelector('#transfer-dest-wrap').classList.remove('hidden');
        } else {
          root.querySelector('#normal-tx-fields').classList.remove('hidden');
          root.querySelector('#quick-cats-section').classList.remove('hidden');
          root.querySelector('#transfer-dest-wrap').classList.add('hidden');
        }
      });

      // ส่วนของการเรนเดอร์หมวดหมู่ลัด (Quick Cats)
      function renderQuickCats() {
        const wrap = root.querySelector('#quick-cats');
        wrap.innerHTML = quickButtons.map((q, i) => `
      <span class="inline-flex items-center gap-1 pop-in">
        <button data-qidx="${i}" class="press text-xs font-medium px-3 py-1.5 rounded-full ${editingQuick ? 'bg-hairline text-muted' : 'bg-hairline'}" ${editingQuick ? 'disabled' : ''}>${q.label}</button>
        ${editingQuick ? `<button data-qdel="${i}" class="press w-6 h-6 rounded-full bg-danger-light text-danger flex items-center justify-center text-xs font-semibold">×</button>` : ''}
      </span>
    `).join('') + (editingQuick ? `<button id="quick-add-open" class="press text-xs font-medium px-3 py-1.5 rounded-full border border-dashed border-primary text-primary">+ เพิ่ม</button>` : '');

        if (!editingQuick) {
          wrap.querySelectorAll('[data-qidx]').forEach(btn => btn.onclick = () => {
            const q = quickButtons[btn.dataset.qidx];
            root.querySelector(`[data-type="${q.type}"]`).click();
            root.querySelector('#tx-category').value = q.category;
          });
        } else {
          wrap.querySelectorAll('[data-qdel]').forEach(btn => btn.onclick = () => {
            quickButtons.splice(btn.dataset.qdel, 1);
            saveQuickCats(quickButtons);
            renderQuickCats();
          });
          const openBtn = wrap.querySelector('#quick-add-open');
          if (openBtn) openBtn.onclick = () => root.querySelector('#quick-add-form').classList.remove('hidden');
        }
      }
      renderQuickCats();

      let qcType = 'expense';
      root.querySelectorAll('.qc-type-btn').forEach(btn => btn.onclick = () => {
        qcType = btn.dataset.qctype;
        root.querySelectorAll('.qc-type-btn').forEach(b => { b.classList.remove('bg-danger', 'bg-success', 'text-white'); b.classList.add('text-ink'); });
        btn.classList.remove('text-ink');
        btn.classList.add(qcType === 'expense' ? 'bg-danger' : 'bg-success', 'text-white');
      });

      root.querySelector('#qc-save').onclick = () => {
        const label = root.querySelector('#qc-label').value.trim();
        const category = root.querySelector('#qc-category').value.trim();
        if (!label || !category) return toast('กรอกชื่อปุ่มและหมวดหมู่ให้ครบ', 'error');
        quickButtons.push({ label, type: qcType, category });
        saveQuickCats(quickButtons);
        root.querySelector('#qc-label').value = '';
        root.querySelector('#qc-category').value = '';
        root.querySelector('#quick-add-form').classList.add('hidden');
        toast('เพิ่มรายการลัดสำเร็จ ✓', 'success');
        renderQuickCats();
      };

      root.querySelector('#quick-edit-toggle').onclick = () => {
        editingQuick = !editingQuick;
        root.querySelector('#quick-edit-label').textContent = editingQuick ? 'เสร็จสิ้น' : 'ปรับแต่ง';
        if (!editingQuick) root.querySelector('#quick-add-form').classList.add('hidden');
        renderQuickCats();
      };

      // ปุ่มเซฟ (จัดการการโอนเงินที่นี่)
      const txSaveBtn = root.querySelector('#tx-save');
      txSaveBtn.onclick = async () => {
        const amount = parseFloat(root.querySelector('#tx-amount').value);
        const note = root.querySelector('#tx-note').value.trim();

        if (!amount || amount <= 0) return toast('กรุณาใส่จำนวนเงิน', 'error');
        if (txSaveBtn.disabled) return;
        txSaveBtn.disabled = true;

        try {
          if (txType === 'transfer') {
            const toAccount = root.querySelector('#transfer-to').value;
            if (selectedAccount === toAccount) {
              txSaveBtn.disabled = false;
              return toast('ไม่สามารถโอนเข้าบัญชีเดียวกันได้', 'error');
            }

            const fromAccName = accounts.find(a => a.id === selectedAccount).name;
            const toAccName = accounts.find(a => a.id === toAccount).name;

            // โค้ดที่ถูกต้อง: ลบ addTransaction เดิมออก และเรียกใช้เฉพาะ RPC
            await DB.executeTransfer({
              from_acc: selectedAccount,
              to_acc: toAccount,
              amount: amount,
              note: note,
              from_name: fromAccName,
              to_name: toAccName
            });

            toast('โอนเงินสำเร็จ ✓', 'success');
          } else {
            const category = root.querySelector('#tx-category').value.trim();
            if (!category) {
              txSaveBtn.disabled = false;
              return toast('กรุณาใส่หมวดหมู่', 'error');
            }
            await DB.addTransaction({ account_id: selectedAccount, type: txType, category, amount, note });
            toast('บันทึกรายการสำเร็จ ✓', 'success');
          }
          go('finance');
        } catch (e) {
          toast('ทำรายการไม่สำเร็จ: ' + e.message, 'error');
          txSaveBtn.disabled = false;
        }
      };

      root.querySelector('#cash-recon').onclick = async () => {
        const btn = root.querySelector('#cash-recon');
        if (btn.disabled) return;

        const actual = parseFloat(root.querySelector('#cash-actual').value);
        if (isNaN(actual)) return toast('กรุณาใส่จำนวนเงินที่นับได้', 'error');
        
        const acc = accounts.find(a => a.id === selectedAccount);
        const diff = actual - acc.balance;
        if (diff === 0) return toast('ยอดตรงกันอยู่แล้ว ✓', 'success');
        
        btn.disabled = true;
        try {
          await DB.addTransaction({ account_id: selectedAccount, type: diff > 0 ? 'income' : 'expense', category: 'กระทบยอดเงินสด', amount: Math.abs(diff), note: 'ปรับยอดให้ตรงกับเงินจริง' });
          toast(`ปรับยอด ${diff > 0 ? '+' : ''}฿${fmtMoney(diff)} สำเร็จ`, 'success');
          go('finance');
        } catch (e) { 
          toast('ทำรายการไม่สำเร็จ: ' + e.message, 'error'); 
        } finally {
          btn.disabled = false;
        }
      };

      try {
        const txs = await DB.getRecentTransactions(15);
        const txListEl = root.querySelector('#tx-list');

       if (txs.length === 0) {
          txListEl.innerHTML = `<p class="text-sm text-muted text-center py-6">ยังไม่มีรายการ</p>`;
        } else {
          txListEl.innerHTML = txs.map(t => `
      <div class="bg-surface border border-hairline rounded-xl px-4 py-3 flex items-center justify-between">
        <div class="min-w-0 flex-1 cursor-pointer" data-tx-edit="${t.id}">
          <!-- ใช้ escapeHTML ป้องกันหน้าจอพัง -->
          <p class="text-sm font-medium">${escapeHTML(t.category)} ${t.note ? `<span class="text-xs font-normal text-muted">(${escapeHTML(t.note)})</span>` : ''}</p>
          <p class="text-xs text-muted">${new Date(t.created_at).toLocaleDateString('th-TH', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}</p>
        </div>
        <div class="flex items-center gap-3">
          <span class="font-display font-semibold tnum ${t.type === 'income' ? 'text-success' : 'text-danger'}">
            ${t.type === 'income' ? '+' : '−'}฿${fmtMoney(t.amount)}
          </span>
          <button data-tx-del="${t.id}" class="press w-7 h-7 rounded-full bg-danger-light text-danger flex items-center justify-center text-sm font-bold">×</button>
        </div>
      </div>
    `).join('');

          // ลบรายการ
          txListEl.querySelectorAll('[data-tx-del]').forEach(btn => {
            btn.onclick = async (e) => {
              e.stopPropagation();
              if (confirm('คุณต้องการลบรายการนี้ใช่หรือไม่? ยอดเงินในกระเป๋าจะถูกปรับคืนให้อัตโนมัติ')) {
                try {
                  await DB.deleteTransaction(btn.dataset.txDel);
                  toast('ลบรายการสำเร็จ ✓', 'success');
                  go('finance');
                } catch (err) {
                  toast('ลบไม่สำเร็จ: ' + err.message, 'error');
                }
              }
            };
          });

          // ดึงข้อมูลแก้ไข
        // ดึงข้อมูลแก้ไข
          txListEl.querySelectorAll('[data-tx-edit]').forEach(el => {
            el.onclick = () => {
              const t = txs.find(x => x.id === el.dataset.txEdit);
              if (!t) return;

              root.querySelector(`[data-acc="${t.account_id}"]`)?.click();
              root.querySelector(`[data-type="${t.type}"]`)?.click();
              root.querySelector('#tx-amount').value = t.amount;
              root.querySelector('#tx-category').value = t.category;
              root.querySelector('#tx-note').value = t.note || '';

              const saveBtn = root.querySelector('#tx-save');
              saveBtn.textContent = 'บันทึกการแก้ไข';
              
              // เช็คและลบปุ่มยกเลิกเก่าออกก่อน (กันมันงอกซ้ำ)
              if (saveBtn.nextElementSibling?.id === 'tx-cancel') {
                saveBtn.nextElementSibling.remove();
              }
              
              // สร้างและแทรกปุ่ม "ยกเลิก"
              const cancelBtn = document.createElement('button');
              cancelBtn.id = 'tx-cancel';
              cancelBtn.className = 'press w-full bg-hairline text-ink font-display font-medium py-3.5 rounded-2xl mt-3 transition-colors';
              cancelBtn.textContent = 'ยกเลิกการแก้ไข';
              cancelBtn.onclick = () => go('finance'); // กดปุ๊บ รีเฟรชหน้าให้ฟอร์มกลับเป็นปกติ
              saveBtn.after(cancelBtn);

              saveBtn.onclick = async () => {
                const amount = parseFloat(root.querySelector('#tx-amount').value);
                const category = root.querySelector('#tx-category').value.trim();
                const note = root.querySelector('#tx-note').value.trim();

                if (!amount || amount <= 0 || !category) return toast('กรอกข้อมูลให้ถูกต้อง', 'error');
                
                if (saveBtn.disabled) return;
                saveBtn.disabled = true;

                try {
                  await DB.updateTransaction({
                    id: t.id, account_id: selectedAccount, type: txType, category, amount, note
                  });
                  toast('แก้ไขรายการสำเร็จ ✓', 'success');
                  go('finance');
                } catch (err) {
                  toast('แก้ไขไม่สำเร็จ: ' + err.message, 'error');
                  saveBtn.disabled = false;
                }
              };

              window.scrollTo({ top: 100, behavior: 'smooth' });
              toast('ดึงข้อมูลขึ้นมาแก้ไขแล้ว', 'info');
            };
          });
        }
      } catch (e) { toast('โหลดรายการไม่สำเร็จ', 'error'); }
    }

    /* Reusable "extra cost" row list — used to add packaging / repack costs
       (e.g. ซื้อคอนเฟลกมาเป็นห่อ แต่แบ่งขายเป็นกล่อง กล่องเปล่าก็มีต้นทุนของมันเอง)
       Each row is { label, total, qty } and contributes total/qty baht per unit.
       Returns a controller with getRows()/getTotalPerUnit() so the caller can
       fold the extra cost into the final cost_price when saving. */
    function mountExtraCostList(wrapEl, onChange) {
      let rows = [];
      function rowHtml(r, i) {
        return `
    <div class="flex gap-1.5 items-center" data-extrarow="${i}">
      <input data-ex-label="${i}" value="${r.label}" placeholder="เช่น ค่ากล่อง" class="w-20 text-xs bg-surface border border-hairline rounded-lg px-2 py-1.5 outline-none min-w-0">
      <input data-ex-total="${i}" type="number" inputmode="decimal" value="${r.total || ''}" placeholder="ราคารวม" class="flex-1 text-xs bg-surface border border-hairline rounded-lg px-2 py-1.5 outline-none min-w-0">
      <input data-ex-qty="${i}" type="number" inputmode="numeric" value="${r.qty || ''}" placeholder="ได้กี่ชิ้น" class="flex-1 text-xs bg-surface border border-hairline rounded-lg px-2 py-1.5 outline-none min-w-0">
      <button data-ex-del="${i}" class="press w-6 h-6 shrink-0 rounded-full bg-danger-light text-danger flex items-center justify-center text-xs">×</button>
    </div>`;
      }
      function totalPerUnit() {
        return rows.reduce((s, r) => s + (r.qty > 0 ? (r.total || 0) / r.qty : 0), 0);
      }
      function render() {
        wrapEl.innerHTML = rows.map(rowHtml).join('');
        rows.forEach((r, i) => {
          wrapEl.querySelector(`[data-ex-label="${i}"]`).addEventListener('input', e => { rows[i].label = e.target.value; });
          wrapEl.querySelector(`[data-ex-total="${i}"]`).addEventListener('input', e => { rows[i].total = parseFloat(e.target.value) || 0; onChange(totalPerUnit()); });
          wrapEl.querySelector(`[data-ex-qty="${i}"]`).addEventListener('input', e => { rows[i].qty = parseInt(e.target.value, 10) || 0; onChange(totalPerUnit()); });
          wrapEl.querySelector(`[data-ex-del="${i}"]`).addEventListener('click', () => { rows.splice(i, 1); render(); onChange(totalPerUnit()); });
        });
        onChange(totalPerUnit());
      }
      render();
      return {
        addRow() { rows.push({ label: '', total: 0, qty: 0 }); render(); },
        getTotalPerUnit: totalPerUnit,
      };
    }

    function bindProductRestockForms(body, products) {
      // toggle restock form
      body.querySelectorAll('[data-restock-toggle]').forEach(btn => {
        btn.onclick = () => {
          const id = btn.dataset.restockToggle;
          body.querySelector(`[data-edit-form="${id}"]`)?.classList.add('hidden');
          body.querySelector(`[data-restock-form="${id}"]`).classList.toggle('hidden');
        };
      });

      // delete product (with confirm) — if it's still assigned to shelves or has stock
      // batches, Supabase's FK constraints will reject the delete; surface that clearly
      // instead of a raw error, since "ลบไม่ได้เพราะมีของผูกอยู่" is the likely cause.
      body.querySelectorAll('[data-delete-product]').forEach(btn => {
        btn.onclick = async () => {
          const p = products.find(x => x.id === btn.dataset.deleteProduct);
          if (!confirm(`ลบ "${p?.name || 'สินค้านี้'}" ใช่หรือไม่? ประวัติต้นทุนและการจัดวางที่ผูกกับสินค้านี้อาจได้รับผลกระทบ`)) return;
          if (btn.disabled) return;
          btn.disabled = true;
          try {
            await DB.deleteProduct(btn.dataset.deleteProduct);
            toast('ลบสินค้าสำเร็จ ✓', 'success');
            go('inventory', { tab: 'products' });
          } catch (e) {
            toast('ลบไม่สำเร็จ — สินค้านี้อาจถูกใช้งานอยู่ (วางบนชั้น/มีต้นทุนผูกอยู่): ' + e.message, 'error');
            btn.disabled = false;
          }
        };
      });

      // toggle + wire up product edit form (name / selling price / min stock alert)
      body.querySelectorAll('[data-edit-toggle]').forEach(btn => {
        btn.onclick = () => {
          const id = btn.dataset.editToggle;
          body.querySelector(`[data-restock-form="${id}"]`)?.classList.add('hidden');
          body.querySelector(`[data-edit-form="${id}"]`).classList.toggle('hidden');
        };
      });
      products.forEach(p => {

 // stepQty: ใช้ RPC เดิมเฉพาะตอน "+", ส่วน "-" ใช้เมธอดใหม่ที่คืนของเข้าสต็อกจริง
async function stepQty(itemId, delta) {
  const it = shelfItems.find(x => x.id === itemId);
  if (!it) return;
  if (delta < 0 && it.quantity <= 0) return;
  if (delta > 0 && (stockByProduct[it.product.id] ?? 0) <= 0) return toast('สินค้าในสต็อกไม่พอ', 'error');

  const qtyEl = body.querySelector(`[data-qty-val="${itemId}"]`);
  const stockEl = body.querySelector(`[data-stock-val="${it.product.id}"]`);
  const prevQty = it.quantity, prevStock = stockByProduct[it.product.id] ?? 0;

  it.quantity = Math.max(0, it.quantity + delta);
  stockByProduct[it.product.id] = Math.max(0, prevStock - delta);
  qtyEl.textContent = it.quantity;
  if (stockEl) stockEl.textContent = stockByProduct[it.product.id];

  try {
    if (delta > 0) {
      await DB.assignProductToShelf(selShelf, it.product.id, delta);
    } else {
      await DB.decrementShelfItem(itemId, it.product.id, -delta);
    }
  } catch (e) {
    it.quantity = prevQty;
    stockByProduct[it.product.id] = prevStock;
    qtyEl.textContent = prevQty;
    if (stockEl) stockEl.textContent = prevStock;
    toast('ปรับจำนวนไม่สำเร็จ: ' + e.message, 'error');
  }
}

        // ลบตัวอักษรที่ไม่เกี่ยวกับการคำนวณออก ป้องกัน Error

            <input id="rv-cost" type="number" inputmode="decimal" placeholder="เช่น 8.2" class="w-full text-sm bg-bg rounded-xl px-3 py-2.5 outline-none focus:ring-2 focus:ring-accent/30">
          </div>
          <div class="flex-1">
            <label class="text-xs text-muted mb-1 block">กำไรที่ต้องการ (%)</label>
            <input id="rv-margin" type="number" inputmode="decimal" placeholder="เช่น 50" class="w-full text-sm bg-bg rounded-xl px-3 py-2.5 outline-none focus:ring-2 focus:ring-accent/30">
          </div>
        </div>
        <div id="rv-result" class="hidden bg-accent-light border border-accent/20 rounded-xl p-3 text-sm text-accent-dark">
          ควรตั้งราคาขายที่ <span class="font-display font-semibold text-lg tnum" id="rv-price">-</span> ต่อชิ้น
        </div>
      </div>
    </details>

    <div id="comparison-section"></div>
  `;

      root.querySelector('#calc-back').onclick = () => go(state.from === 'inventory' ? 'inventory' : 'dashboard');

      const inputs = ['#c-price', '#c-cost-total', '#c-misc-cost', '#c-qty', '#c-free-qty'].map(sel => root.querySelector(sel));
      const [priceEl, totalEl, miscEl, qtyEl, freeEl] = inputs;
      const resultBox = root.querySelector('#c-result');
      const addBtn = root.querySelector('#c-add');

      let lastCalc = null;

      function computeAndRender() {
        const price = parseMath(priceEl.value);
        const total = parseMath(totalEl.value);
        const misc = parseMath(miscEl.value);
        const qty = parseMath(qtyEl.value);
        const freeQty = parseMath(freeEl.value);

        const totalCostSum = total + misc;
        const totalQtySum = qty + freeQty;

        if (totalCostSum > 0 && totalQtySum > 0 && price >= 0) {
          const costUnit = totalCostSum / totalQtySum;
          const profitUnit = price - costUnit;
          const markup = costUnit > 0 ? (profitUnit / costUnit) * 100 : 0;
          const margin = price > 0 ? (profitUnit / price) * 100 : 0;
          const totalProfit = profitUnit * totalQtySum; // นำของแถมมาทำกำไรด้วย
          
          lastCalc = { 
            price, total: totalCostSum, qty: totalQtySum, 
            costUnit, profitUnit, totalProfit 
          };

          resultBox.classList.remove('hidden');
          root.querySelector('#r-cost-unit').textContent = `฿${fmtMoney(costUnit)}`;
          root.querySelector('#r-total-items').textContent = `${totalQtySum} ชิ้น`;
          
          const profitColor = profitUnit >= 0 ? 'text-primary' : 'text-danger';
          
          const pUnitEl = root.querySelector('#r-profit-unit');
          pUnitEl.textContent = `฿${fmtMoney(profitUnit)}`;
          pUnitEl.className = `font-display font-semibold text-base tnum ${profitColor}`;
          
          root.querySelector('#r-markup').textContent = `${fmtMoney(markup)}%`;
          root.querySelector('#r-margin').textContent = `${fmtMoney(margin)}%`;
          
          const pTotalEl = root.querySelector('#r-total-profit');
          pTotalEl.textContent = `฿${fmtMoney(totalProfit)}`;
          pTotalEl.className = `font-display font-semibold text-xl tnum ${profitColor}`;
          
          addBtn.disabled = false;
          root.querySelector('#rv-cost').value = costUnit.toFixed(2);
        } else {
          resultBox.classList.add('hidden');
          addBtn.disabled = true;
          lastCalc = null;
        }
      }

      inputs.forEach(el => el.addEventListener('input', computeAndRender));

      root.querySelector('#c-clear').onclick = () => {
        root.querySelector('#c-name').value = '';
        inputs.forEach(el => el.value = '');
        computeAndRender();
      };

      addBtn.onclick = () => {
        if (!lastCalc) return;
        const name = root.querySelector('#c-name').value.trim() || 'สินค้าไม่มีชื่อ';
        scratch.push({ id: uid('calc'), name, ...lastCalc });
        saveCalcScratch(scratch);
        toast('เพิ่มลงรายการเปรียบเทียบแล้ว ✓', 'success');
        go('calculator', state);
      };

      // ส่วนคำนวณราคาขาย (Reverse Margin)
      const rvCost = root.querySelector('#rv-cost');
      const rvMargin = root.querySelector('#rv-margin');
      const rvResult = root.querySelector('#rv-result');
      function computeReverse() {
        const cost = parseMath(rvCost.value);
        const marginPct = parseMath(rvMargin.value);
        if (cost > 0 && marginPct > 0) {
          const suggested = cost / (1 - (marginPct / 100)); // คำนวณ Margin ที่ถูกต้อง (ไม่ใช่ Markup)
          rvResult.classList.remove('hidden');
          root.querySelector('#rv-price').textContent = `฿${fmtMoney(suggested)}`;
        } else {
          rvResult.classList.add('hidden');
        }
      }
      rvCost.addEventListener('input', computeReverse);
      rvMargin.addEventListener('input', computeReverse);

      // เรนเดอร์รายการเปรียบเทียบ (Scratch list)
      function renderComparison() {
        const wrap = root.querySelector('#comparison-section');
        if (scratch.length === 0) {
          wrap.innerHTML = '';
          return;
        }

        // หาต้นทุนต่อชิ้นที่ถูกที่สุดเพื่อไฮไลท์
        const minCost = Math.min(...scratch.map(s => s.costUnit));

        wrap.innerHTML = `
          <div class="flex items-center justify-between mb-3 border-t border-hairline pt-4">
            <h2 class="font-display font-semibold text-base">รายการเปรียบเทียบ (${scratch.length})</h2>
            <button id="c-clear-all" class="press text-xs text-danger font-medium bg-danger-light px-2 py-1 rounded-md">ล้างทั้งหมด</button>
          </div>
          <div class="space-y-2 mb-6">
            ${scratch.map(s => {
              const isBest = scratch.length > 1 && s.costUnit === minCost;
              return `
              <div class="border ${isBest ? 'border-success bg-success-light/30' : 'border-hairline bg-surface'} rounded-xl px-4 py-3 flex items-center justify-between relative shadow-sm">
                ${isBest ? `<div class="absolute -top-2.5 right-4 bg-success text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow-sm pop-in">👑 คุ้มสุด</div>` : ''}
                <div class="min-w-0">
                  <p class="text-sm font-medium truncate mb-0.5">${escapeHTML(s.name)}</p>
                  <p class="text-xs ${isBest ? 'text-success-dark font-medium' : 'text-muted'}">
                    ทุน ฿${fmtMoney(s.costUnit)}/ชิ้น · ${s.qty} ชิ้น
                  </p>
                  <p class="text-[10px] text-muted">ลงทุนรวม ฿${fmtMoney(s.total)}</p>
                </div>
                <div class="flex flex-col items-end gap-1 shrink-0">
                  <span class="font-display font-semibold text-sm tnum ${s.profitUnit >= 0 ? 'text-primary' : 'text-danger'}">
                    +฿${fmtMoney(s.totalProfit)}
                  </span>
                  <button data-del-calc="${s.id}" class="press text-xs text-danger flex items-center gap-1 mt-1">
                    ลบ
                  </button>
                </div>
              </div>`
            }).join('')}
          </div>
        `;

        wrap.querySelectorAll('[data-del-calc]').forEach(btn => btn.onclick = () => {
          scratch = scratch.filter(s => s.id !== btn.dataset.delCalc);
          saveCalcScratch(scratch);
          renderComparison();
        });

        wrap.querySelector('#c-clear-all').onclick = () => {
          scratch = [];
          saveCalcScratch(scratch);
          renderComparison();
        };
      }

      renderComparison();
    }

    /* ============================================================
       12) INIT
       ============================================================ */
    if (!CONFIGURED) {
      document.getElementById('app').innerHTML = `
    <div class="bg-danger-light border border-danger/30 text-danger rounded-2xl p-4 text-sm">
      ยังไม่ได้ตั้งค่า Supabase — กรุณาใส่ค่า <b>SUPABASE_URL</b> และ <b>SUPABASE_ANON_KEY</b>
      ที่ด้านบนของไฟล์ก่อนใช้งานจริง
    </div>`;
      toast('ยังไม่ได้ตั้งค่า Supabase', 'error');
    } else {
      updateNetBadge();
      go('dashboard');
      if (navigator.onLine) syncQueue();
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => { });
      });
    }

    /* ============================================================
       13) ACCOUNTS & TRANSACTIONS OVERVIEW
       ============================================================ */
    async function renderAccounts(root, state) {
      const activeTab = state.tab || 'business'; // 'business' | 'personal'
      const timeFilter = state.filter || 'month'; // 'day' | 'week' | 'month' | 'all'

      root.innerHTML = `
    <div class="flex items-center gap-3 mb-5">
      <button id="acc-back" class="press text-muted flex items-center justify-center w-9 h-9 rounded-full bg-surface border border-hairline shadow-sm">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <h1 class="font-display text-2xl font-semibold">รายการแยกบัญชี</h1>
    </div>

    <!-- Tabs สลับประเภทบัญชี -->
    <div class="flex bg-surface rounded-full p-1 border border-hairline mb-4 relative shadow-sm">
      <div id="acc-seg" class="absolute top-1 bottom-1 w-1/2 rounded-full bg-primary transition-transform duration-300 ease-out" style="transform: translateX(${activeTab === 'business' ? '0%' : '100%'})"></div>
      <button data-acctab="business" class="relative z-10 flex-1 py-2 text-sm font-medium rounded-full transition-colors ${activeTab === 'business' ? 'text-white' : 'text-ink'}">🏪 บัญชีร้านค้า</button>
      <button data-acctab="personal" class="relative z-10 flex-1 py-2 text-sm font-medium rounded-full transition-colors ${activeTab === 'personal' ? 'text-white' : 'text-ink'}">👤 บัญชีส่วนตัว</button>
    </div>

    <!-- Filter กรองเวลา -->
    <div class="flex gap-2 overflow-x-auto no-scrollbar mb-4 pb-1">
      ${[['day', 'วันนี้'], ['week', '7 วันล่าสุด'], ['month', 'เดือนนี้'], ['all', 'ทั้งหมด']].map(([k, l]) => `
        <button data-tfilter="${k}" class="press whitespace-nowrap text-xs font-medium px-4 py-2 rounded-full transition-colors ${timeFilter === k ? 'bg-ink text-white' : 'bg-surface border border-hairline text-muted'}">${l}</button>
      `).join('')}
    </div>

    <div id="acc-content">
      ${skeleton('h-40')}
      <div class="mt-4">${skeleton('h-16')}</div>
      <div class="mt-2">${skeleton('h-16')}</div>
    </div>
  `;

      // ผูก Event ปุ่มย้อนกลับ และสลับ Tab/Filter
      root.querySelector('#acc-back').onclick = () => go('dashboard');

      root.querySelectorAll('[data-acctab]').forEach(btn => btn.onclick = () => {
        if (activeTab === btn.dataset.acctab) return;
        go('accounts', { ...state, tab: btn.dataset.acctab, filter: timeFilter });
      });

      root.querySelectorAll('[data-tfilter]').forEach(btn => btn.onclick = () => {
        if (timeFilter === btn.dataset.tfilter) return;
        go('accounts', { ...state, tab: activeTab, filter: btn.dataset.tfilter });
      });

      try {
        // โหลดข้อมูลบัญชีทั้งหมด และรายการเคลื่อนไหวตามเวลาที่กรอง
        const [accounts, transactions] = await Promise.all([
          DB.getAccounts(),
          DB.getAllTransactions(timeFilter)
        ]);

        // กรองเฉพาะบัญชีที่ตรงกับ Tab ปัจจุบัน
        const activeAccounts = accounts.filter(a => a.type === activeTab);
        const activeAccIds = activeAccounts.map(a => a.id);

        // กรองเฉพาะ Transaction ของบัญชีเหล่านั้น
        const activeTxs = transactions.filter(t => activeAccIds.includes(t.account_id));

        // คำนวณสรุปยอด
        const totalBalance = activeAccounts.reduce((sum, a) => sum + a.balance, 0);
        const totalIncome = activeTxs.filter(t => t.type === 'income').reduce((sum, t) => sum + t.amount, 0);
        const totalExpense = activeTxs.filter(t => t.type === 'expense').reduce((sum, t) => sum + t.amount, 0);

        let contentHtml = `
      <!-- สรุปยอดรวมบัตรใหญ่ -->
      <div class="bg-primary text-white rounded-3xl p-5 shadow-lg mb-6 relative overflow-hidden pop-in">
        <div class="absolute -right-4 -top-4 opacity-10">
          <svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="1.5" fill="currentColor" stroke="none"/></svg>
        </div>
        <p class="text-white/80 text-sm mb-1">เงินคงเหลือรวมทั้งหมด (${activeTab === 'business' ? 'ร้านค้า' : 'ส่วนตัว'})</p>
        <p class="font-display font-semibold text-3xl tnum mb-5">฿${fmtMoney(totalBalance)}</p>
        
        <div class="flex items-center gap-4 pt-4 border-t border-white/20">
          <div class="flex-1">
            <p class="text-xs text-white/70 mb-1 flex items-center gap-1">
              <span class="w-4 h-4 rounded-full bg-success/20 flex items-center justify-center"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" class="text-success-light"><path d="M12 19V5M5 12l7-7 7 7"/></svg></span> รายรับ
            </p>
            <p class="font-display font-semibold text-lg text-success-light tnum">+฿${fmtMoney(totalIncome)}</p>
          </div>
          <div class="w-px h-10 bg-white/20"></div>
          <div class="flex-1">
            <p class="text-xs text-white/70 mb-1 flex items-center gap-1">
              <span class="w-4 h-4 rounded-full bg-danger/20 flex items-center justify-center"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" class="text-danger-light"><path d="M12 5v14M19 12l-7 7-7-7"/></svg></span> รายจ่าย
            </p>
            <p class="font-display font-semibold text-lg text-danger-light tnum">-฿${fmtMoney(totalExpense)}</p>
          </div>
        </div>
      </div>

      <!-- แยกยอดแต่ละบัญชี -->
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-display font-semibold text-base">ยอดคงเหลือแต่ละบัญชี</h2>
      </div>
      <div class="grid grid-cols-2 gap-3 mb-6">
        ${activeAccounts.map((a, i) => `
          <div class="bg-surface border border-hairline rounded-2xl p-4 shadow-sm pop-in" style="animation-delay: ${i * 50}ms">
            <p class="text-xs font-medium text-muted truncate mb-1.5">${a.name}</p>
            <p class="font-display font-semibold text-lg tnum text-primary">฿${fmtMoney(a.balance)}</p>
          </div>
        `).join('')}
      </div>

      <!-- รายการเคลื่อนไหว (Transactions) -->
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-display font-semibold text-base">รายการเคลื่อนไหว</h2>
        <span class="text-xs text-muted">${activeTxs.length} รายการ</span>
      </div>
      
      <div class="space-y-3 pb-8">
        ${activeTxs.length === 0 ? `
          <div class="text-center py-8 bg-surface border border-dashed border-hairline rounded-2xl">
            <p class="text-sm text-muted">ไม่มีรายการเข้า-ออกในช่วงเวลานี้</p>
          </div>
        ` : activeTxs.map((t, i) => {
          const acc = activeAccounts.find(a => a.id === t.account_id);
          const isIncome = t.type === 'income';
          return `
          <div class="bg-surface border border-hairline rounded-2xl p-3.5 flex items-center gap-3 shadow-sm pop-in" style="animation-delay: ${i * 30}ms">
            <div class="w-11 h-11 rounded-xl ${isIncome ? 'bg-success-light text-success' : 'bg-danger-light text-danger'} flex items-center justify-center shrink-0">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                ${isIncome ? '<path d="M12 19V5M5 12l7-7 7 7"/>' : '<path d="M12 5v14M19 12l-7 7-7-7"/>'}
              </svg>
            </div>
            <div class="min-w-0 flex-1">
              <p class="text-[15px] font-medium truncate">${t.category}</p>
              <p class="text-xs text-muted truncate mt-0.5">
                <span class="font-medium text-ink/70">${acc?.name || 'ไม่ทราบ'}</span> ${t.note ? `· ${t.note}` : ''}
              </p>
            </div>
            <div class="text-right shrink-0">
              <p class="font-display font-semibold text-base tnum ${isIncome ? 'text-success' : 'text-danger'}">
                ${isIncome ? '+' : '-'}฿${fmtMoney(t.amount)}
              </p>
              <p class="text-[10px] text-muted mt-0.5">${new Date(t.created_at).toLocaleDateString('th-TH', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</p>
            </div>
          </div>
        `}).join('')}
      </div>
    `;

        root.querySelector('#acc-content').innerHTML = contentHtml;

      } catch (e) {
        console.error(e);
        root.querySelector('#acc-content').innerHTML = `
      <div class="bg-danger-light border border-danger/20 rounded-2xl p-4 text-center">
        <p class="text-danger text-sm">โหลดข้อมูลไม่สำเร็จ: ${e.message}</p>
        <button class="mt-2 text-xs font-medium text-danger underline" onclick="refreshCurrentRoute()">ลองใหม่</button>
      </div>`;
      }
    }

    /* ============================================================
       14) ADVANCED ANALYTICS DASHBOARD
       ============================================================ */
    async function renderAnalytics(root) {
      root.innerHTML = `
    <div class="flex items-center gap-3 mb-5">
      <button id="an-back" class="press text-muted flex items-center justify-center w-9 h-9 rounded-full bg-surface border border-hairline shadow-sm">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <h1 class="font-display text-2xl font-semibold">สถิติเชิงลึก (7 วัน)</h1>
    </div>

    <div class="bg-surface border border-hairline rounded-3xl p-4 shadow-sm mb-4 pop-in">
      <h2 class="font-display font-medium text-sm mb-3">📈 แนวโน้มรายรับ vs รายจ่าย (7 วันล่าสุด)</h2>
      <div class="relative w-full h-48">
        <canvas id="trendChart"></canvas>
      </div>
    </div>

    <div class="bg-surface border border-hairline rounded-3xl p-4 shadow-sm pop-in" style="animation-delay: 50ms;">
      <h2 class="font-display font-medium text-sm mb-3">🍩 สัดส่วนรายจ่ายแยกตามหมวดหมู่</h2>
      <div class="relative w-full h-48 flex justify-center">
        <canvas id="expenseChart"></canvas>
      </div>
    </div>
  `;

      root.querySelector('#an-back').onclick = () => go('dashboard');

      try {
        const txs = await DB.getAnalyticsData(); // ดึง tx ย้อนหลังสัปดาห์นึง

        // 1. ประมวลผลข้อมูลสำหรับกราฟเส้น (รับ-จ่าย รายวัน)
        const last7Days = [...Array(7)].map((_, i) => {
          const d = new Date(); d.setDate(d.getDate() - i);
          return d.toLocaleDateString('th-TH', { month: 'short', day: 'numeric' });
        }).reverse();

        const dailyIncome = Array(7).fill(0);
        const dailyExpense = Array(7).fill(0);

        txs.forEach(t => {
          const dStr = new Date(t.created_at).toLocaleDateString('th-TH', { month: 'short', day: 'numeric' });
          const idx = last7Days.indexOf(dStr);
          if (idx !== -1) {
            if (t.type === 'income') dailyIncome[idx] += t.amount;
            if (t.type === 'expense') dailyExpense[idx] += t.amount;
          }
        });

        // วาดกราฟเส้น Trend
        new Chart(document.getElementById('trendChart'), {
          type: 'line',
          data: {
            labels: last7Days,
            datasets: [
              { label: 'รายรับ', data: dailyIncome, borderColor: '#3FA34D', backgroundColor: '#3FA34D33', fill: true, tension: 0.4 },
              { label: 'รายจ่าย', data: dailyExpense, borderColor: '#D9483F', backgroundColor: '#D9483F33', fill: true, tension: 0.4 }
            ]
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { position: 'bottom', labels: { font: { family: 'Sarabun' } } } },
            scales: { y: { beginAtZero: true, ticks: { font: { family: 'Sarabun' } } }, x: { ticks: { font: { family: 'Sarabun' } } } }
          }
        });

        // 2. ประมวลผลข้อมูลสำหรับกราฟโดนัท (สัดส่วนหมวดหมู่รายจ่าย)
        const expenses = txs.filter(t => t.type === 'expense');
        const expByCategory = {};
        expenses.forEach(t => { expByCategory[t.category] = (expByCategory[t.category] || 0) + t.amount; });

        const expLabels = Object.keys(expByCategory);
        const expData = Object.values(expByCategory);
        const bgColors = ['#D9483F', '#F2A33C', '#145C52', '#6B7770', '#1B2420', '#D8DED2'];

        new Chart(document.getElementById('expenseChart'), {
          type: 'doughnut',
          data: {
            labels: expLabels.length ? expLabels : ['ไม่มีข้อมูล'],
            datasets: [{
              data: expData.length ? expData : [1],
              backgroundColor: expData.length ? bgColors : ['#E4E7E0'],
              borderWidth: 2
            }]
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: {
              legend: { position: 'right', labels: { font: { family: 'Sarabun' }, boxWidth: 12 } }
            },
            cutout: '65%'
          }
        });

      } catch (e) {
        toast('โหลดข้อมูลสถิติไม่สำเร็จ', 'error');
      }
    }
  </script>
