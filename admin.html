<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Admin System - จัดการข้อมูลหลังบ้าน</title>
<meta name="theme-color" content="#0E453D">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          background: '#F5F7F1',
          surface: '#FFFFFF',
          primary: '#145C52',
          'primary-dark': '#0E453D',
          'primary-light': '#E4EFEA',
          secondary: '#3FA34D',
          warning: '#D98A22',
          error: '#D9483F',
          ink: '#1B2420',
          muted: '#6B7770',
          hairline: '#E4E7E0',
        },
        fontFamily: {
          display: ['Kanit', 'sans-serif'],
          body: ['Sarabun', 'sans-serif'],
        }
      }
    }
  }
</script>
<style>
  * { -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Sarabun', sans-serif; background-color: #F5F7F1; color: #1B2420; }
  .font-display { font-family: 'Kanit', sans-serif; }
  .hide-scrollbar::-webkit-scrollbar { display: none; }
  .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  
  /* Modal Animation */
  #admin-modal { transition: opacity 0.2s ease; }
  #admin-modal > div { transition: transform 0.2s ease; }
  .modal-hidden { opacity: 0; pointer-events: none; }
  .modal-hidden > div { transform: scale(0.95); }

  /* Toast */
  #toast-wrap { position: fixed; top: 16px; left: 0; right: 0; z-index: 999; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; }
  .toast { pointer-events:auto; animation: toastIn .3s ease both; }
  @keyframes toastIn { from { opacity:0; transform: translateY(-16px);} to { opacity:1; transform:none; } }
  .toast.out { animation: toastOut .2s ease forwards; }
  @keyframes toastOut { to { opacity:0; transform: translateY(-10px); } }
  
  input, select { border: 1px solid #E4E7E0; }
  input:focus, select:focus { border-color: #145C52; outline: none; box-shadow: 0 0 0 2px rgba(20, 92, 82, 0.1); }
</style>
</head>
<body class="antialiased h-screen flex flex-col overflow-hidden">

<div id="toast-wrap"></div>

<!-- Header -->
<header class="bg-primary-dark text-white shadow-md z-40 shrink-0">
  <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <a href="index.html" class="w-9 h-9 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center transition-colors text-white" title="กลับหน้าร้านค้า">
        <span class="material-symbols-outlined text-[20px]">arrow_back</span>
      </a>
      <span class="material-symbols-outlined text-[28px]">admin_panel_settings</span>
      <h1 class="font-display text-xl font-semibold tracking-wide">Admin Dashboard</h1>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="switchTab('reset')" class="flex items-center gap-1.5 bg-error hover:bg-error/90 text-white text-xs px-3 py-1.5 rounded-full font-medium shadow transition-all active:scale-95" title="เริ่มต้นเทอมใหม่">
        <span class="material-symbols-outlined text-[16px]">restart_alt</span>
        <span>รีเซ็ตเทอมใหม่</span>
      </button>
      <div class="text-xs bg-white/20 px-3 py-1.5 rounded-full font-medium hidden sm:block">แก้ไขข้อมูลโดยตรง</div>
    </div>
  </div>
  
  <!-- Tabs -->
  <div class="max-w-4xl mx-auto px-2 flex overflow-x-auto hide-scrollbar gap-1 pb-2">
    <button data-tab="stock" class="tab-btn active font-display font-medium text-sm px-4 py-2 rounded-lg bg-white text-primary-dark whitespace-nowrap transition-colors">สต็อก & สินค้า</button>
    <button data-tab="shelves" class="tab-btn font-display font-medium text-sm px-4 py-2 rounded-lg text-white/80 hover:bg-white/10 whitespace-nowrap transition-colors">จุดวางสินค้า</button>
    <button data-tab="finance" class="tab-btn font-display font-medium text-sm px-4 py-2 rounded-lg text-white/80 hover:bg-white/10 whitespace-nowrap transition-colors">การเงิน & บัญชี</button>
    <button data-tab="discrepancies" class="tab-btn font-display font-medium text-sm px-4 py-2 rounded-lg text-white/80 hover:bg-white/10 whitespace-nowrap transition-colors">ส่วนต่างสต็อก (Shadow)</button>
    <button data-tab="master" class="tab-btn font-display font-medium text-sm px-4 py-2 rounded-lg text-white/80 hover:bg-white/10 whitespace-nowrap transition-colors">ตึก & ชั้นวาง</button>
    <button data-tab="reset" class="tab-btn font-display font-medium text-sm px-4 py-2 rounded-lg text-white/80 hover:bg-white/10 whitespace-nowrap transition-colors flex items-center gap-1.5 border border-error/40 bg-error/15">
      <span class="material-symbols-outlined text-[18px] text-error">restart_alt</span>
      <span>เริ่มต้นเทอมใหม่ (Reset)</span>
    </button>
  </div>
</header>

<!-- Main Content Area -->
<main class="flex-1 overflow-y-auto max-w-4xl mx-auto w-full p-4 pb-24" id="main-content">
  <div class="text-center py-10 text-muted">กำลังโหลดข้อมูล...</div>
</main>

<!-- Generic Modal -->
<div id="admin-modal" class="fixed inset-0 z-[100] bg-ink/50 backdrop-blur-sm flex items-center justify-center p-4 modal-hidden">
  <div class="bg-surface w-full max-w-md rounded-2xl shadow-xl overflow-hidden flex flex-col max-h-[90vh]">
    <div class="px-5 py-4 border-b border-hairline flex items-center justify-between bg-primary-light/30">
      <h3 id="modal-title" class="font-display font-semibold text-lg text-primary-dark">แก้ไขข้อมูล</h3>
      <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center rounded-full bg-hairline/50 text-muted hover:text-error transition-colors">
        <span class="material-symbols-outlined text-[20px]">close</span>
      </button>
    </div>
    <div id="modal-body" class="p-5 overflow-y-auto flex-1 space-y-4">
      <!-- Form injected here -->
    </div>
    <div class="p-4 border-t border-hairline bg-background flex gap-3">
      <button onclick="closeModal()" class="flex-1 py-2.5 rounded-xl font-medium text-muted bg-surface border border-hairline">ยกเลิก</button>
      <button id="modal-save-btn" class="flex-1 py-2.5 rounded-xl font-medium text-white bg-primary shadow-sm active:scale-95 transition-transform">บันทึก</button>
    </div>
</div>

<!-- Reset Progress Modal -->
<div id="reset-progress-modal" class="fixed inset-0 z-[150] bg-ink/60 backdrop-blur-sm flex items-center justify-center p-4 modal-hidden">
  <div class="bg-surface w-full max-w-md rounded-2xl shadow-2xl p-6 flex flex-col">
    <div class="text-center mb-4">
      <div id="progress-icon-wrap" class="w-14 h-14 rounded-full bg-primary-light text-primary mx-auto flex items-center justify-center mb-3">
        <span id="progress-main-icon" class="material-symbols-outlined text-[32px] animate-spin">sync</span>
      </div>
      <h3 id="progress-modal-title" class="font-display font-bold text-lg text-primary-dark">กำลังดำเนินการเริ่มต้นเทอมใหม่</h3>
      <p id="progress-modal-sub" class="text-xs text-muted mt-1">ระบบกำลังสำรองข้อมูลและปรับปรุงฐานข้อมูล โปรดอย่าปิดหน้าต่างนี้</p>
    </div>

    <!-- Step Items -->
    <div id="progress-steps" class="space-y-1.5 py-3 border-y border-hairline text-xs font-medium max-h-60 overflow-y-auto">
      <!-- Steps will be injected dynamically -->
    </div>

    <div class="mt-4 flex">
      <button id="btn-progress-done" onclick="finishResetModal()" disabled class="w-full py-2.5 rounded-xl font-medium text-white bg-primary opacity-40 cursor-not-allowed transition-all">
        กำลังดำเนินการ...
      </button>
    </div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// --- CONFIGURATION ---
 const SUPABASE_URL = 'https://dfemavcrzpmmgqqjrxvz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmZW1hdmNyenBtbWdxcWpyeHZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2ODY4NTEsImV4cCI6MjEwMTI2Mjg1MX0.JYsRkjRwbAqKxqB9MT5iMDOeh5zh087sWmKo_Jx1cbc';


const CONFIGURED = !SUPABASE_URL.includes('YOUR_') && !!SUPABASE_ANON_KEY;
const supabase = CONFIGURED ? createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

// ป้องกันการโหลด admin.html เก่าที่ค้างอยู่ใน Service Worker Cache
if ('caches' in window) {
  caches.keys().then(keys => {
    keys.forEach(k => {
      caches.open(k).then(cache => {
        cache.delete(window.location.href);
        cache.delete(window.location.pathname);
      });
    });
  });
}

// --- UTILS ---
function escapeHTML(str) {
  if (!str) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

function fmtMoney(n) { 
  return Number(n || 0).toLocaleString('th-TH', { minimumFractionDigits: 0, maximumFractionDigits: 2 }); 
}

function toast(msg, kind = 'info') {
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  const styles = { info: 'bg-ink text-white', success: 'bg-secondary text-white', error: 'bg-error text-white' };
  el.className = `toast ${styles[kind] || styles.info} text-sm px-4 py-2.5 rounded-full shadow-lg font-medium`;
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 200); }, 2500);
}

// --- STATE ---
let currentTab = 'stock';
let appData = {};

// --- MODAL SYSTEM ---
let modalAction = null;
window.closeModal = () => {
  document.getElementById('admin-modal').classList.add('modal-hidden');
  modalAction = null;
};

function openModal(title, fields, onSave) {
  document.getElementById('modal-title').textContent = title;
  const body = document.getElementById('modal-body');
  
  let html = '';
  fields.forEach((f, idx) => {
    html += `
      <div>
        <label class="block text-xs font-medium text-muted mb-1">${f.label}</label>
        ${f.type === 'select' ? `
          <select id="modal-input-${idx}" class="w-full bg-surface rounded-xl px-3 py-2.5 text-sm">
            ${f.options.map(o => `<option value="${o.value}" ${f.value == o.value ? 'selected' : ''}>${escapeHTML(o.text)}</option>`).join('')}
          </select>
        ` : `
          <input id="modal-input-${idx}" type="${f.type || 'text'}" value="${f.value !== undefined ? escapeHTML(f.value) : ''}" ${f.disabled ? 'disabled' : ''} class="w-full bg-surface rounded-xl px-3 py-2.5 text-sm ${f.disabled ? 'bg-background text-muted' : ''}">
        `}
      </div>
    `;
  });
  
  body.innerHTML = html;
  document.getElementById('admin-modal').classList.remove('modal-hidden');
  
  document.getElementById('modal-save-btn').onclick = async () => {
    const btn = document.getElementById('modal-save-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span>';
    
    const values = fields.map((_, idx) => document.getElementById(`modal-input-${idx}`).value);
    try {
      await onSave(values);
      closeModal();
      loadData(); // Reload view
    } catch (e) {
      toast(e.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'บันทึก';
    }
  };
}

// --- DATA FETCHING ---
async function loadData() {
  if (!CONFIGURED) return document.getElementById('main-content').innerHTML = '<div class="p-4 bg-error/10 text-error rounded-xl">กรุณาตั้งค่า Supabase URL/Key ในโค้ดก่อน</div>';
  
  document.getElementById('main-content').innerHTML = '<div class="text-center py-10 text-muted flex flex-col items-center"><span class="material-symbols-outlined animate-spin text-[32px] mb-2">sync</span> กำลังโหลดข้อมูล...</div>';
  
  try {
    const [ 
      {data: prods}, 
      {data: batches}, 
      {data: pshelves}, 
      {data: shelves}, 
      {data: bldgs}, 
      {data: accs}, 
      {data: txs, count: txCount}, 
      {data: disc, count: discCount},
      notesRes
    ] = await Promise.all([
      supabase.from('products').select('*').order('name'),
      supabase.from('stock_batches').select('*').order('created_at', {ascending: false}),
      supabase.from('product_shelves').select('*'),
      supabase.from('shelves').select('*').order('floor'),
      supabase.from('buildings').select('*').order('name'),
      supabase.from('accounts').select('*').order('type'),
      supabase.from('transactions').select('*', { count: 'exact' }).order('created_at', {ascending: false}).limit(100),
      supabase.from('stock_discrepancies').select('*', { count: 'exact' }).order('detected_at', {ascending: false}).limit(100),
      supabase.from('notes').select('*')
    ]);
    
    appData = { 
      prods: prods || [], 
      batches: batches || [], 
      pshelves: pshelves || [], 
      shelves: shelves || [], 
      bldgs: bldgs || [], 
      accs: accs || [], 
      txs: txs || [], 
      totalTxCount: txCount ?? (txs ? txs.length : 0),
      disc: disc || [],
      totalDiscCount: discCount ?? (disc ? disc.length : 0),
      notes: notesRes?.data || []
    };
    renderTab();
  } catch (e) {
    toast('โหลดข้อมูลไม่สำเร็จ: ' + e.message, 'error');
  }
}

// --- RENDERERS ---
function renderTab() {
  const main = document.getElementById('main-content');
  if (currentTab === 'stock') main.innerHTML = renderStockTab();
  else if (currentTab === 'shelves') main.innerHTML = renderShelvesTab();
  else if (currentTab === 'finance') main.innerHTML = renderFinanceTab();
  else if (currentTab === 'discrepancies') main.innerHTML = renderDiscrepanciesTab();
  else if (currentTab === 'master') main.innerHTML = renderMasterTab();
  else if (currentTab === 'reset') {
    main.innerHTML = renderResetTab();
    renderPastHistory();
  }
}

// 1. สต็อก & สินค้า
function renderStockTab() {
  let html = `<div class="flex justify-between items-center mb-4">
                <h2 class="font-display text-lg font-semibold">ล็อตสินค้า (Stock Batches)</h2>
                <span class="text-xs text-muted">แก้ไขต้นทุน/จำนวนคงเหลือตรงๆ</span>
              </div>
              <div class="space-y-3">`;
              
  appData.batches.forEach(b => {
    const p = appData.prods.find(x => x.id === b.product_id);
    html += `
      <div class="bg-surface rounded-xl p-4 shadow-sm border border-hairline flex items-center justify-between">
        <div>
          <p class="font-medium text-sm">${p ? escapeHTML(p.name) : 'Unknown'}</p>
          <p class="text-xs text-muted mt-0.5">วันที่: ${new Date(b.created_at).toLocaleString('th-TH')} | ID: <span class="font-mono text-[10px]">${b.id.split('-')[0]}</span></p>
          <div class="flex gap-3 mt-2">
            <span class="text-xs bg-primary-light text-primary-dark px-2 py-1 rounded">เหลือ: <b>${b.remaining_qty}</b></span>
            <span class="text-xs bg-hairline px-2 py-1 rounded">ทุน: ฿${fmtMoney(b.cost_price)}</span>
          </div>
        </div>
        <button onclick="editBatch('${b.id}')" class="w-10 h-10 rounded-full bg-background border border-hairline flex items-center justify-center text-primary hover:bg-primary-light transition-colors">
          <span class="material-symbols-outlined text-[18px]">edit</span>
        </button>
      </div>`;
  });
  return html + '</div>';
}

window.editBatch = (id) => {
  const b = appData.batches.find(x => x.id === id);
  const p = appData.prods.find(x => x.id === b.product_id);
  openModal(`แก้สต็อกล็อต: ${p?.name}`, [
    { label: 'จำนวนคงเหลือจริง (Remaining Qty)', type: 'number', value: b.remaining_qty },
    { label: 'ราคาต้นทุนต่อชิ้น (Cost Price)', type: 'number', value: b.cost_price }
  ], async (vals) => {
    const qty = parseInt(vals[0]);
    const cost = parseFloat(vals[1]);
    if (isNaN(qty) || isNaN(cost)) throw new Error('ข้อมูลไม่ถูกต้อง');
    const { error } = await supabase.from('stock_batches').update({ remaining_qty: qty, cost_price: cost }).eq('id', id);
    if (error) throw error;
    toast('อัปเดตสต็อกล็อตสำเร็จ', 'success');
  });
};

// 2. จุดวางสินค้า
function renderShelvesTab() {
  let html = `<div class="flex justify-between items-center mb-4">
                <h2 class="font-display text-lg font-semibold">จุดวางบนชั้น (Product Shelves)</h2>
              </div>
              <div class="space-y-3">`;
              
  appData.pshelves.forEach(ps => {
    const p = appData.prods.find(x => x.id === ps.product_id);
    const s = appData.shelves.find(x => x.id === ps.shelf_id);
    const b = s ? appData.bldgs.find(x => x.id === s.building_id) : null;
    const locName = b && s ? `${b.name} - ชั้น ${s.floor}` : 'Unknown Location';
    
    html += `
      <div class="bg-surface rounded-xl p-4 shadow-sm border border-hairline flex items-center justify-between">
        <div>
          <p class="font-medium text-sm text-primary-dark">${locName}</p>
          <p class="text-sm mt-0.5">${p ? escapeHTML(p.name) : 'Unknown Product'}</p>
          <p class="text-xs text-muted mt-1">วางอยู่: <b class="text-ink text-sm">${ps.quantity}</b> ชิ้น</p>
        </div>
        <div class="flex gap-2">
          <button onclick="editProductShelf('${ps.id}')" class="w-9 h-9 rounded-lg bg-background border border-hairline flex items-center justify-center text-primary">
            <span class="material-symbols-outlined text-[18px]">edit</span>
          </button>
          <button onclick="deleteProductShelf('${ps.id}')" class="w-9 h-9 rounded-lg bg-error/10 border border-error/20 flex items-center justify-center text-error">
            <span class="material-symbols-outlined text-[18px]">delete</span>
          </button>
        </div>
      </div>`;
  });
  return html + '</div>';
}

window.editProductShelf = (id) => {
  const ps = appData.pshelves.find(x => x.id === id);
  openModal(`แก้ไขจำนวนบนชั้น`, [
    { label: 'จำนวนที่จัดวาง (Quantity)', type: 'number', value: ps.quantity }
  ], async (vals) => {
    const qty = parseInt(vals[0]);
    if (isNaN(qty) || qty < 0) throw new Error('จำนวนไม่ถูกต้อง');
    const { error } = await supabase.from('product_shelves').update({ quantity: qty }).eq('id', id);
    if (error) throw error;
    toast('อัปเดตจำนวนบนชั้นสำเร็จ', 'success');
  });
};

window.deleteProductShelf = async (id) => {
  if (!confirm('ยืนยันการลบการจัดวางนี้? (ของจะหายไปจากชั้น)')) return;
  const { error } = await supabase.from('product_shelves').delete().eq('id', id);
  if (error) return toast(error.message, 'error');
  toast('ลบจุดจัดวางสำเร็จ', 'success');
  loadData();
};

// 3. การเงิน
function renderFinanceTab() {
  let html = `<div class="mb-6">
                <h2 class="font-display text-lg font-semibold mb-3">ยอดเงินบัญชี (Accounts)</h2>
                <div class="grid grid-cols-2 gap-3">`;
  appData.accs.forEach(a => {
    html += `
      <div class="bg-surface rounded-xl p-3 shadow-sm border border-hairline relative">
        <p class="text-xs text-muted mb-1">${escapeHTML(a.name)}</p>
        <p class="font-display font-semibold text-lg text-primary-dark">฿${fmtMoney(a.balance)}</p>
        <button onclick="editAccountBalance('${a.id}')" class="absolute top-2 right-2 text-muted hover:text-primary"><span class="material-symbols-outlined text-[16px]">edit_square</span></button>
      </div>`;
  });
  html += `</div></div>
           <div>
              <h2 class="font-display text-lg font-semibold mb-3">แก้ไขธุรกรรม (Transactions)</h2>
              <div class="space-y-2">`;
              
  appData.txs.forEach(t => {
    const isInc = t.type === 'income';
    html += `
      <div class="bg-surface rounded-xl p-3 shadow-sm border border-hairline flex items-center justify-between">
        <div class="min-w-0 flex-1 pr-2">
          <div class="flex items-center gap-2">
             <span class="material-symbols-outlined text-[14px] ${isInc ? 'text-secondary' : 'text-error'}">${isInc ? 'arrow_downward' : 'arrow_upward'}</span>
             <p class="text-sm font-medium truncate">${escapeHTML(t.category)}</p>
          </div>
          <p class="text-[10px] text-muted truncate mt-0.5">${new Date(t.created_at).toLocaleString('th-TH')} ${t.note ? `| ${escapeHTML(t.note)}` : ''}</p>
        </div>
        <div class="flex items-center gap-3 shrink-0">
          <span class="font-display font-medium text-sm ${isInc ? 'text-secondary' : 'text-error'}">${isInc?'+':'-'}฿${fmtMoney(t.amount)}</span>

// ดาวน์โหลดข้อมูลเป็นไฟล์ JSON
function downloadJSON(data, filename) {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// ดึงข้อมูลทั้งหมดในตาราง (รองรับ pagination มากกว่า 1,000 รายการ)
async function fetchAllFromTable(tableName) {
  let all = [];
  let page = 0;
  const pageSize = 1000;
  while (true) {
    const from = page * pageSize;
    const to = from + pageSize - 1;
    const { data, error } = await supabase
      .from(tableName)
      .select('*')
      .range(from, to);
    if (error) {
      console.warn(`Error fetching ${tableName}:`, error);
      break;
    }
    if (!data || data.length === 0) break;
    all.push(...data);
    if (data.length < pageSize) break;
    page++;
  }
  return all;
}

// ล้างข้อมูลในตารางทั้งหมดอย่างปลอดภัย
async function deleteAllFromTable(tableName) {
  let attempts = 0;
  while (attempts < 10) {
    attempts++;
    const { error } = await supabase.from(tableName).delete().not('id', 'is', null);
    if (error) throw new Error(`ไม่สามารถลบข้อมูลในตาราง ${tableName}: ${error.message}`);
    
    // ตรวจสอบว่ายังมีเรคคอร์ดหลงเหลือหรือไม่
    const { count, error: cErr } = await supabase.from(tableName).select('id', { count: 'exact', head: true });
    if (cErr || !count || count === 0) break;
  }
}

// 6.2 ตรวจสอบรหัสยืนยัน RESET
window.checkResetInput = (val) => {
  const btn = document.getElementById('btn-execute-reset');
  if (!btn) return;
  const isMatch = val.trim().toUpperCase() === 'RESET';
  btn.disabled = !isMatch;
  if (isMatch) {
    btn.classList.remove('opacity-40', 'cursor-not-allowed');
    btn.classList.add('hover:bg-error/90', 'active:scale-95');
  } else {
    btn.classList.add('opacity-40', 'cursor-not-allowed');
    btn.classList.remove('hover:bg-error/90', 'active:scale-95');
  }
};

// 6.5 ดำเนินการรีเซ็ตระบบ
async function executeReset(options, onProgress) {
  // ขั้นที่ 1: รวบรวมข้อมูลทั้งหมด
  onProgress(1, 'กำลังรวบรวมข้อมูลทั้งหมดของระบบเพื่อสำรองข้อมูล...');
  const [
    allAccs,
    allTxs,
    allBatches,
    allAdjustments,
    allDisc,
    allPshelves,
    allProds,
    allBldgs,
    allShelves,
    allSettings,
    allNotes,
    allJobs
  ] = await Promise.all([
    fetchAllFromTable('accounts'),
    fetchAllFromTable('transactions'),
    fetchAllFromTable('stock_batches'),
    fetchAllFromTable('stock_adjustments'),
    fetchAllFromTable('stock_discrepancies'),
    fetchAllFromTable('product_shelves'),
    fetchAllFromTable('products'),
    fetchAllFromTable('buildings'),
    fetchAllFromTable('shelves'),
    fetchAllFromTable('shop_settings'),
    fetchAllFromTable('notes'),
    fetchAllFromTable('service_jobs')
  ]);

  const totalBalance = allAccs.reduce((sum, a) => sum + Number(a.balance || 0), 0);
  const totalIncome = allTxs.filter(t => t.type === 'income').reduce((sum, t) => sum + Number(t.amount || 0), 0);
  const totalExpense = allTxs.filter(t => t.type === 'expense').reduce((sum, t) => sum + Number(t.amount || 0), 0);
  const totalLoss = allAdjustments.reduce((sum, a) => sum + Number(a.loss_value || 0), 0);

  const backupData = {
    export_type: 'honesty_shop_semester_reset_backup',
    created_at: new Date().toISOString(),
    term_name: options.termName || `รอบวันที่ ${new Date().toLocaleDateString('th-TH')}`,
    summary: {
      total_balance_before_reset: totalBalance,
      total_income: totalIncome,
      total_expenses: totalExpense,
      net_profit: totalIncome - totalExpense,
      total_loss_value: totalLoss,
      total_transactions: allTxs.length,
      total_stock_batches: allBatches.length,
      total_adjustments: allAdjustments.length,
      total_discrepancies: allDisc.length,
      total_products: allProds.length,
      total_buildings: allBldgs.length,
      total_shelves: allShelves.length,
      total_product_shelves: allPshelves.length
    },
    data: {
      accounts: allAccs,
      transactions: allTxs,
      stock_batches: allBatches,
      stock_adjustments: allAdjustments,
      stock_discrepancies: allDisc,
      product_shelves: allPshelves,
      products: allProds,
      buildings: allBldgs,
      shelves: allShelves,
      shop_settings: allSettings,
      notes: allNotes,
      service_jobs: allJobs
    }
  };

  // ขั้นที่ 2: บันทึกและดาวน์โหลด JSON อัตโนมัติ
  onProgress(2, 'สร้างและดาวน์โหลดไฟล์สำรองข้อมูล (JSON)...');
  const dateStr = new Date().toISOString().slice(0, 10);
  const safeTermName = (options.termName || 'term').replace(/[^a-zA-Z0-9_\u0E00-\u0E7F]/g, '_');
  const filename = `backup_${safeTermName}_${dateStr}.json`;
  downloadJSON(backupData, filename);

  // ขั้นที่ 3: บันทึกประวัติลง localStorage
  onProgress(3, 'บันทึกประวัติการปิดเทอมลงในระบบประวัติ...');
  try {
    const history = JSON.parse(localStorage.getItem('honesty_semester_history') || '[]');
    history.unshift({
      id: 'term_' + Date.now(),
      reset_at: new Date().toISOString(),
      term_name: options.termName || `รอบวันที่ ${new Date().toLocaleDateString('th-TH')}`,
      summary: backupData.summary,
      backup_filename: filename
    });
    localStorage.setItem('honesty_semester_history', JSON.stringify(history.slice(0, 20)));
  } catch (e) {
    console.warn('Cannot write history to localStorage:', e);
  }

  // ขั้นที่ 4: ล้าง stock_discrepancies และ stock_adjustments
  onProgress(4, 'ล้างรายการส่วนต่างและของหาย (Discrepancies & Adjustments)...');
  await deleteAllFromTable('stock_discrepancies');
  await deleteAllFromTable('stock_adjustments');

  // ขั้นที่ 5: จัดการสินค้าบนชั้นวาง (product_shelves)
  onProgress(5, 'รีเซ็ต/ล้างสินค้าบนชั้นวาง (Product Shelves)...');
  if (options.shelfMode === 'clear') {
    await deleteAllFromTable('product_shelves');
  } else {
    const { error: psErr } = await supabase.from('product_shelves').update({ quantity: 0 }).not('id', 'is', null);
    if (psErr) throw new Error('ไม่สามารถรีเซ็ตจำนวนสินค้าบนชั้น: ' + psErr.message);
  }

  // ขั้นที่ 6: ล้างล็อตสต็อกสินค้าในคลัง (stock_batches)
  onProgress(6, 'ล้างล็อตสต็อกสินค้าในคลัง (Stock Batches)...');
  await deleteAllFromTable('stock_batches');

  // ขั้นที่ 7: ล้างประวัติธุรกรรม (transactions)
  onProgress(7, 'ล้างประวัติธุรกรรมรายรับ-รายจ่าย (Transactions)...');
  await deleteAllFromTable('transactions');

  // ขั้นที่ 8: ปรับยอดเงินคงเหลือในบัญชีเป็น 0.00
  onProgress(8, 'ปรับยอดเงินคงเหลือทุกบัญชีเป็น ฿0.00 (Accounts)...');
  const { error: accErr } = await supabase.from('accounts').update({ balance: 0.00 }).not('id', 'is', null);
  if (accErr) throw new Error('ไม่สามารถรีเซ็ตยอดเงินบัญชี: ' + accErr.message);

  // ขั้นที่ 9: ปรับรอบคำนวณส่วนต่างยอดขาย (shop_settings)
  onProgress(9, 'ปรับรอบคำนวณส่วนต่างยอดขาย (Shop Settings)...');
  try {
    await supabase.from('shop_settings').update({ last_reconciled_at: new Date().toISOString() }).eq('id', 1);
  } catch (e) {
    console.warn('shop_settings update:', e);
  }

  // ขั้นที่ 10 (เสริม): ล้างโน้ตบันทึกและงานบริการถ้าผู้ใช้เลือก
  if (options.clearNotes) {
    try { await deleteAllFromTable('notes'); } catch (e) {}
    try { await deleteAllFromTable('service_jobs'); } catch (e) {}
  }

  onProgress(10, 'เสร็จสิ้นเรียบร้อย! เริ่มต้นเทอมใหม่แล้ว');
}

// 6.6 กล่องยืนยันและเริ่มการรีเซ็ต
window.confirmAndExecuteReset = async () => {
  const codeInput = document.getElementById('reset-confirm-code');
  if (!codeInput || codeInput.value.trim().toUpperCase() !== 'RESET') {
    return toast('กรุณาพิมพ์ RESET ให้ถูกต้องเพื่อยืนยัน', 'error');
  }

  const termInput = document.getElementById('reset-term-name');
  const termName = termInput ? termInput.value.trim() : 'เทอมใหม่';

  const shelfModeEl = document.querySelector('input[name="shelf-mode"]:checked');
  const shelfMode = shelfModeEl ? shelfModeEl.value : 'reset_qty';

  const clearNotes = document.getElementById('reset-clear-notes')?.checked || false;

  if (!confirm(msg)) return;

  // เปิด Progress Modal
  const modal = document.getElementById('reset-progress-modal');
  const stepsContainer = document.getElementById('progress-steps');
  const mainIcon = document.getElementById('progress-main-icon');
  const modalTitle = document.getElementById('progress-modal-title');

  doneBtn.textContent = 'กำลังดำเนินการ...';
  mainIcon.textContent = 'sync';
  mainIcon.classList.remove('text-secondary', 'text-error');
  mainIcon.classList.add('animate-spin', 'text-primary');
  modalTitle.textContent = 'กำลังดำเนินการเริ่มต้นเทอมใหม่';

  const stepsList = [
    'รวบรวมข้อมูลทั้งหมดของระบบเพื่อสำรองข้อมูล',
    'สร้างและดาวน์โหลดไฟล์สำรองข้อมูล (JSON)',
    'บันทึกประวัติการปิดเทอมลงในระบบประวัติ',
    'ล้างรายการส่วนต่างและของหาย (Discrepancies & Adjustments)',
    'รีเซ็ต/ล้างสินค้าบนชั้นวาง (Product Shelves)',
    'ล้างล็อตสต็อกสินค้าในคลัง (Stock Batches)',
    'ล้างประวัติธุรกรรมรายรับ-รายจ่าย (Transactions)',
    'ปรับยอดเงินคงเหลือทุกบัญชีเป็น ฿0.00 (Accounts)',
    'ปรับรอบคำนวณส่วนต่างยอดขาย (Shop Settings)',
    'เสร็จสิ้นเรียบร้อย! เริ่มต้นเทอมใหม่แล้ว'
  ];

  // เรนเดอร์ Skeleton สำหรับ Progress Steps
  stepsList.forEach((st, idx) => {
    const el = document.createElement('div');
    el.id = `step-item-${idx + 1}`;
    el.className = 'flex items-center gap-2.5 text-muted py-1';
    el.innerHTML = `
      <span class="material-symbols-outlined text-[16px] text-muted shrink-0">radio_button_unchecked</span>
      <span>${st}</span>
    `;
    stepsContainer.appendChild(el);
  });

  const updateProgressUI = (stepNum, isDone = false) => {
    for (let i = 1; i <= stepsList.length; i++) {
      const stepEl = document.getElementById(`step-item-${i}`);
      if (!stepEl) continue;
      const icon = stepEl.querySelector('.material-symbols-outlined');
      if (i < stepNum || (i === stepNum && isDone)) {
        stepEl.className = 'flex items-center gap-2.5 text-secondary font-medium py-1';
        icon.textContent = 'check_circle';
        icon.className = 'material-symbols-outlined text-[16px] text-secondary shrink-0';
      } else if (i === stepNum) {
        stepEl.className = 'flex items-center gap-2.5 text-primary-dark font-medium py-1';
        icon.textContent = 'sync';
        icon.className = 'material-symbols-outlined text-[16px] text-primary shrink-0 animate-spin';
        stepEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }
  };

  try {
    await executeReset({
      termName,
      shelfMode,
      clearNotes
    }, (stepNum, text) => {
      updateProgressUI(stepNum);
    });

    // สำเร็จทั้งหมด
    updateProgressUI(stepsList.length, true);
    mainIcon.textContent = 'check_circle';
    mainIcon.classList.remove('animate-spin', 'text-primary');
    mainIcon.classList.add('text-secondary');
    modalTitle.textContent = '🎉 เริ่มต้นเทอมใหม่สำเร็จเรียบร้อย!';
    
    doneBtn.disabled = false;
    doneBtn.classList.remove('opacity-40', 'cursor-not-allowed', 'bg-primary');
    doneBtn.classList.add('bg-secondary', 'hover:bg-secondary/90', 'active:scale-95');
    doneBtn.textContent = 'เสร็จสิ้น (ไปที่หน้าข้อมูล)';

    toast('เริ่มต้นเทอมใหม่สำเร็จ พร้อมเริ่มใช้งานแล้ว ✓', 'success');
  } catch (err) {
    console.error(err);
    mainIcon.textContent = 'error';
    mainIcon.classList.remove('animate-spin', 'text-primary');
    mainIcon.classList.add('text-error');
    modalTitle.textContent = 'เกิดข้อผิดพลาดในการรีเซ็ต';
    
    toast('เกิดข้อผิดพลาด: ' + err.message, 'error');
    doneBtn.disabled = false;
    doneBtn.classList.remove('opacity-40', 'cursor-not-allowed', 'bg-primary');
    doneBtn.classList.add('bg-error');
    doneBtn.textContent = 'ปิดหน้าต่าง';
  }
};

// 6.7 ปิดหน้าต่างความคืบหน้าเมื่อเสร็จสิ้น
window.finishResetModal = () => {
  document.getElementById('reset-progress-modal').classList.add('modal-hidden');
  loadData();
  switchTab('stock');
};

loadData();


</script>
</body>
</html>
