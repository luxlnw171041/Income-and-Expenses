<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Admin System - จัดการข้อมูลหลังบ้าน</title>
<meta name="theme-color" content="#0E453D">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          background: '#F5F7F1',
          surface: '#FFFFFF',
          primary: '#145C52',
          'primary-dark': '#0E453D',
          'primary-light': '#E4EFEA',
          secondary: '#3FA34D',
          warning: '#D98A22',
          error: '#D9483F',
          ink: '#1B2420',
          muted: '#6B7770',
          hairline: '#E4E7E0',
        },
        fontFamily: {
          display: ['Kanit', 'sans-serif'],
          body: ['Sarabun', 'sans-serif'],
        }
      }
    }
  }
</script>
<style>
  * { -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Sarabun', sans-serif; background-color: #F5F7F1; color: #1B2420; }
  .font-display { font-family: 'Kanit', sans-serif; }
  .hide-scrollbar::-webkit-scrollbar { display: none; }
  .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  
  /* Modal Animation */
  #admin-modal { transition: opacity 0.2s ease; }
  #admin-modal > div { transition: transform 0.2s ease; }
  .modal-hidden { opacity: 0; pointer-events: none; }
  .modal-hidden > div { transform: scale(0.95); }

  /* Toast */
  #toast-wrap { position: fixed; top: 16px; left: 0; right: 0; z-index: 999; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; }
  .toast { pointer-events:auto; animation: toastIn .3s ease both; }
  @keyframes toastIn { from { opacity:0; transform: translateY(-16px);} to { opacity:1; transform:none; } }
  .toast.out { animation: toastOut .2s ease forwards; }
  @keyframes toastOut { to { opacity:0; transform: translateY(-10px); } }
  
  input, select { border: 1px solid #E4E7E0; }
  input:focus, select:focus { border-color: #145C52; outline: none; box-shadow: 0 0 0 2px rgba(20, 92, 82, 0.1); }
</style>
</head>
<body class="antialiased h-screen flex flex-col overflow-hidden">

<div id="toast-wrap"></div>

<!-- Header -->
<header class="bg-primary-dark text-white shadow-md z-40 shrink-0">
  <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <span class="material-symbols-outlined text-[28px]">admin_panel_settings</span>
      <h1 class="font-display text-xl font-semibold tracking-wide">Admin Dashboard</h1>
    </div>
    <div class="text-xs bg-white/20 px-3 py-1.5 rounded-full font-medium">แก้ไขข้อมูลโดยตรง</div>
  </div>
  
  <!-- Tabs -->
  <div class="max-w-4xl mx-auto px-2 flex overflow-x-auto hide-scrollbar gap-1 pb-2">
  <button data-tab="stock" class="tab-btn active font-display font-medium text-sm px-4 py-2 rounded-lg bg-white text-primary-dark whitespace-nowrap transition-colors">สต็อก & สินค้า</button>
    <button data-tab="shelves" class="tab-btn font-display font-medium text-sm px-4 py-2 rounded-lg text-white/80 hover:bg-white/10 whitespace-nowrap transition-colors">จุดวางสินค้า</button>
    <button data-tab="finance" class="tab-btn font-display font-medium text-sm px-4 py-2 rounded-lg text-white/80 hover:bg-white/10 whitespace-nowrap transition-colors">การเงิน & บัญชี</button>
    <button data-tab="discrepancies" class="tab-btn font-display font-medium text-sm px-4 py-2 rounded-lg text-white/80 hover:bg-white/10 whitespace-nowrap transition-colors">ส่วนต่างสต็อก (Shadow)</button>
    <button data-tab="master" class="tab-btn font-display font-medium text-sm px-4 py-2 rounded-lg text-white/80 hover:bg-white/10 whitespace-nowrap transition-colors">ตึก & ชั้นวาง</button>
  </div>
</header>

<!-- Main Content Area -->
<main class="flex-1 overflow-y-auto max-w-4xl mx-auto w-full p-4 pb-24" id="main-content">
  <div class="text-center py-10 text-muted">กำลังโหลดข้อมูล...</div>
</main>

<!-- Generic Modal -->
<div id="admin-modal" class="fixed inset-0 z-[100] bg-ink/50 backdrop-blur-sm flex items-center justify-center p-4 modal-hidden">
  <div class="bg-surface w-full max-w-md rounded-2xl shadow-xl overflow-hidden flex flex-col max-h-[90vh]">
    <div class="px-5 py-4 border-b border-hairline flex items-center justify-between bg-primary-light/30">
      <h3 id="modal-title" class="font-display font-semibold text-lg text-primary-dark">แก้ไขข้อมูล</h3>
      <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center rounded-full bg-hairline/50 text-muted hover:text-error transition-colors">
        <span class="material-symbols-outlined text-[20px]">close</span>
      </button>
    </div>
    <div id="modal-body" class="p-5 overflow-y-auto flex-1 space-y-4">
      <!-- Form injected here -->
    </div>
    <div class="p-4 border-t border-hairline bg-background flex gap-3">
      <button onclick="closeModal()" class="flex-1 py-2.5 rounded-xl font-medium text-muted bg-surface border border-hairline">ยกเลิก</button>
      <button id="modal-save-btn" class="flex-1 py-2.5 rounded-xl font-medium text-white bg-primary shadow-sm active:scale-95 transition-transform">บันทึก</button>
    </div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// --- CONFIGURATION ---
 const SUPABASE_URL = 'https://dfemavcrzpmmgqqjrxvz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmZW1hdmNyenBtbWdxcWpyeHZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2ODY4NTEsImV4cCI6MjEwMTI2Mjg1MX0.JYsRkjRwbAqKxqB9MT5iMDOeh5zh087sWmKo_Jx1cbc';


const CONFIGURED = !SUPABASE_URL.includes('YOUR_') && !!SUPABASE_ANON_KEY;
const supabase = CONFIGURED ? createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

// --- UTILS ---
function escapeHTML(str) {
  if (!str) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

function fmtMoney(n) { 
  return Number(n || 0).toLocaleString('th-TH', { minimumFractionDigits: 0, maximumFractionDigits: 2 }); 
}

function toast(msg, kind = 'info') {
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  const styles = { info: 'bg-ink text-white', success: 'bg-secondary text-white', error: 'bg-error text-white' };
  el.className = `toast ${styles[kind] || styles.info} text-sm px-4 py-2.5 rounded-full shadow-lg font-medium`;
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 200); }, 2500);
}

// --- STATE ---
let currentTab = 'stock';
let appData = {};

// --- MODAL SYSTEM ---
let modalAction = null;
window.closeModal = () => {
  document.getElementById('admin-modal').classList.add('modal-hidden');
  modalAction = null;
};

function openModal(title, fields, onSave) {
  document.getElementById('modal-title').textContent = title;
  const body = document.getElementById('modal-body');
  
  let html = '';
  fields.forEach((f, idx) => {
    html += `
      <div>
        <label class="block text-xs font-medium text-muted mb-1">${f.label}</label>
        ${f.type === 'select' ? `
          <select id="modal-input-${idx}" class="w-full bg-surface rounded-xl px-3 py-2.5 text-sm">
            ${f.options.map(o => `<option value="${o.value}" ${f.value == o.value ? 'selected' : ''}>${escapeHTML(o.text)}</option>`).join('')}
          </select>
        ` : `
          <input id="modal-input-${idx}" type="${f.type || 'text'}" value="${f.value !== undefined ? escapeHTML(f.value) : ''}" ${f.disabled ? 'disabled' : ''} class="w-full bg-surface rounded-xl px-3 py-2.5 text-sm ${f.disabled ? 'bg-background text-muted' : ''}">
        `}
      </div>
    `;
  });
  
  body.innerHTML = html;
  document.getElementById('admin-modal').classList.remove('modal-hidden');
  
  document.getElementById('modal-save-btn').onclick = async () => {
    const btn = document.getElementById('modal-save-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span>';
    
    const values = fields.map((_, idx) => document.getElementById(`modal-input-${idx}`).value);
    try {
      await onSave(values);
      closeModal();
      loadData(); // Reload view
    } catch (e) {
      toast(e.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'บันทึก';
    }
  };
}

// --- DATA FETCHING ---
async function loadData() {
  if (!CONFIGURED) return document.getElementById('main-content').innerHTML = '<div class="p-4 bg-error/10 text-error rounded-xl">กรุณาตั้งค่า Supabase URL/Key ในโค้ดก่อน</div>';
  
  document.getElementById('main-content').innerHTML = '<div class="text-center py-10 text-muted flex flex-col items-center"><span class="material-symbols-outlined animate-spin text-[32px] mb-2">sync</span> กำลังโหลดข้อมูล...</div>';
  
  try {
const [ {data: prods}, {data: batches}, {data: pshelves}, {data: shelves}, {data: bldgs}, {data: accs}, {data: txs}, {data: disc} ] = await Promise.all([
      supabase.from('products').select('*').order('name'),
      supabase.from('stock_batches').select('*').order('created_at', {ascending: false}),
      supabase.from('product_shelves').select('*'),
      supabase.from('shelves').select('*').order('floor'),
      supabase.from('buildings').select('*').order('name'),
      supabase.from('accounts').select('*').order('type'),
      supabase.from('transactions').select('*').order('created_at', {ascending: false}).limit(100),
      supabase.from('stock_discrepancies').select('*').order('created_at', {ascending: false}).limit(100)
    ]);
    
    appData = { prods, batches, pshelves, shelves, bldgs, accs, txs, disc };
    renderTab();
  } catch (e) {
    toast('โหลดข้อมูลไม่สำเร็จ: ' + e.message, 'error');
  }
}

// --- RENDERERS ---
function renderTab() {
  const main = document.getElementById('main-content');
  if (currentTab === 'stock') main.innerHTML = renderStockTab();
  else if (currentTab === 'shelves') main.innerHTML = renderShelvesTab();
  else if (currentTab === 'finance') main.innerHTML = renderFinanceTab();
  else if (currentTab === 'discrepancies') main.innerHTML = renderDiscrepanciesTab();
  else if (currentTab === 'master') main.innerHTML = renderMasterTab();
}

// 1. สต็อก & สินค้า
function renderStockTab() {
  let html = `<div class="flex justify-between items-center mb-4">
                <h2 class="font-display text-lg font-semibold">ล็อตสินค้า (Stock Batches)</h2>
                <span class="text-xs text-muted">แก้ไขต้นทุน/จำนวนคงเหลือตรงๆ</span>
              </div>
              <div class="space-y-3">`;
              
  appData.batches.forEach(b => {
    const p = appData.prods.find(x => x.id === b.product_id);
    html += `
      <div class="bg-surface rounded-xl p-4 shadow-sm border border-hairline flex items-center justify-between">
        <div>
          <p class="font-medium text-sm">${p ? escapeHTML(p.name) : 'Unknown'}</p>
          <p class="text-xs text-muted mt-0.5">วันที่: ${new Date(b.created_at).toLocaleString('th-TH')} | ID: <span class="font-mono text-[10px]">${b.id.split('-')[0]}</span></p>
          <div class="flex gap-3 mt-2">
            <span class="text-xs bg-primary-light text-primary-dark px-2 py-1 rounded">เหลือ: <b>${b.remaining_qty}</b></span>
            <span class="text-xs bg-hairline px-2 py-1 rounded">ทุน: ฿${fmtMoney(b.cost_price)}</span>
          </div>
        </div>
        <button onclick="editBatch('${b.id}')" class="w-10 h-10 rounded-full bg-background border border-hairline flex items-center justify-center text-primary hover:bg-primary-light transition-colors">
          <span class="material-symbols-outlined text-[18px]">edit</span>
        </button>
      </div>`;
  });
  return html + '</div>';
}

window.editBatch = (id) => {
  const b = appData.batches.find(x => x.id === id);
  const p = appData.prods.find(x => x.id === b.product_id);
  openModal(`แก้สต็อกล็อต: ${p?.name}`, [
    { label: 'จำนวนคงเหลือจริง (Remaining Qty)', type: 'number', value: b.remaining_qty },
    { label: 'ราคาต้นทุนต่อชิ้น (Cost Price)', type: 'number', value: b.cost_price }
  ], async (vals) => {
    const qty = parseInt(vals[0]);
    const cost = parseFloat(vals[1]);
    if (isNaN(qty) || isNaN(cost)) throw new Error('ข้อมูลไม่ถูกต้อง');
    const { error } = await supabase.from('stock_batches').update({ remaining_qty: qty, cost_price: cost }).eq('id', id);
    if (error) throw error;
    toast('อัปเดตสต็อกล็อตสำเร็จ', 'success');
  });
};

// 2. จุดวางสินค้า
function renderShelvesTab() {
  let html = `<div class="flex justify-between items-center mb-4">
                <h2 class="font-display text-lg font-semibold">จุดวางบนชั้น (Product Shelves)</h2>
              </div>
              <div class="space-y-3">`;
              
  appData.pshelves.forEach(ps => {
    const p = appData.prods.find(x => x.id === ps.product_id);
    const s = appData.shelves.find(x => x.id === ps.shelf_id);
    const b = s ? appData.bldgs.find(x => x.id === s.building_id) : null;
    const locName = b && s ? `${b.name} - ชั้น ${s.floor}` : 'Unknown Location';
    
    html += `
      <div class="bg-surface rounded-xl p-4 shadow-sm border border-hairline flex items-center justify-between">
        <div>
          <p class="font-medium text-sm text-primary-dark">${locName}</p>
          <p class="text-sm mt-0.5">${p ? escapeHTML(p.name) : 'Unknown Product'}</p>
          <p class="text-xs text-muted mt-1">วางอยู่: <b class="text-ink text-sm">${ps.quantity}</b> ชิ้น</p>
        </div>
        <div class="flex gap-2">
          <button onclick="editProductShelf('${ps.id}')" class="w-9 h-9 rounded-lg bg-background border border-hairline flex items-center justify-center text-primary">
            <span class="material-symbols-outlined text-[18px]">edit</span>
          </button>
          <button onclick="deleteProductShelf('${ps.id}')" class="w-9 h-9 rounded-lg bg-error/10 border border-error/20 flex items-center justify-center text-error">
            <span class="material-symbols-outlined text-[18px]">delete</span>
          </button>
        </div>
      </div>`;
  });
  return html + '</div>';
}

window.editProductShelf = (id) => {
  const ps = appData.pshelves.find(x => x.id === id);
  openModal(`แก้ไขจำนวนบนชั้น`, [
    { label: 'จำนวนที่จัดวาง (Quantity)', type: 'number', value: ps.quantity }
  ], async (vals) => {
    const qty = parseInt(vals[0]);
    if (isNaN(qty) || qty < 0) throw new Error('จำนวนไม่ถูกต้อง');
    const { error } = await supabase.from('product_shelves').update({ quantity: qty }).eq('id', id);
    if (error) throw error;
    toast('อัปเดตจำนวนบนชั้นสำเร็จ', 'success');
  });
};

window.deleteProductShelf = async (id) => {
  if (!confirm('ยืนยันการลบการจัดวางนี้? (ของจะหายไปจากชั้น)')) return;
  const { error } = await supabase.from('product_shelves').delete().eq('id', id);
  if (error) return toast(error.message, 'error');
  toast('ลบจุดจัดวางสำเร็จ', 'success');
  loadData();
};

// 3. การเงิน
function renderFinanceTab() {
  let html = `<div class="mb-6">
                <h2 class="font-display text-lg font-semibold mb-3">ยอดเงินบัญชี (Accounts)</h2>
                <div class="grid grid-cols-2 gap-3">`;
  appData.accs.forEach(a => {
    html += `
      <div class="bg-surface rounded-xl p-3 shadow-sm border border-hairline relative">
        <p class="text-xs text-muted mb-1">${escapeHTML(a.name)}</p>
        <p class="font-display font-semibold text-lg text-primary-dark">฿${fmtMoney(a.balance)}</p>
        <button onclick="editAccountBalance('${a.id}')" class="absolute top-2 right-2 text-muted hover:text-primary"><span class="material-symbols-outlined text-[16px]">edit_square</span></button>
      </div>`;
  });
  html += `</div></div>
           <div>
              <h2 class="font-display text-lg font-semibold mb-3">แก้ไขธุรกรรม (Transactions)</h2>
              <div class="space-y-2">`;
              
  appData.txs.forEach(t => {
    const isInc = t.type === 'income';
    html += `
      <div class="bg-surface rounded-xl p-3 shadow-sm border border-hairline flex items-center justify-between">
        <div class="min-w-0 flex-1 pr-2">
          <div class="flex items-center gap-2">
             <span class="material-symbols-outlined text-[14px] ${isInc ? 'text-secondary' : 'text-error'}">${isInc ? 'arrow_downward' : 'arrow_upward'}</span>
             <p class="text-sm font-medium truncate">${escapeHTML(t.category)}</p>
          </div>
          <p class="text-[10px] text-muted truncate mt-0.5">${new Date(t.created_at).toLocaleString('th-TH')} ${t.note ? `| ${escapeHTML(t.note)}` : ''}</p>
        </div>
        <div class="flex items-center gap-3 shrink-0">
          <span class="font-display font-medium text-sm ${isInc ? 'text-secondary' : 'text-error'}">${isInc?'+':'-'}฿${fmtMoney(t.amount)}</span>
          <button onclick="editTx('${t.id}')" class="w-8 h-8 rounded bg-background flex items-center justify-center text-ink"><span class="material-symbols-outlined text-[16px]">edit</span></button>
          <button onclick="deleteTx('${t.id}')" class="w-8 h-8 rounded bg-error/10 flex items-center justify-center text-error"><span class="material-symbols-outlined text-[16px]">delete</span></button>
        </div>
      </div>`;
  });
  return html + '</div></div>';
}

window.editAccountBalance = (id) => {
  const acc = appData.accs.find(x => x.id === id);
  openModal(`แก้ยอดเงิน: ${acc.name}`, [
    { label: 'ยอดเงินคงเหลือปัจจุบัน (Force Override)', type: 'number', value: acc.balance }
  ], async (vals) => {
    const bal = parseFloat(vals[0]);
    if (isNaN(bal)) throw new Error('ยอดเงินไม่ถูกต้อง');
    const { error } = await supabase.from('accounts').update({ balance: bal }).eq('id', id);
    if (error) throw error;
    toast('ปรับยอดเงินบัญชีสำเร็จ', 'success');
  });
};

window.editTx = (id) => {
  const t = appData.txs.find(x => x.id === id);
  openModal(`แก้ไขธุรกรรม`, [
    { label: 'หมวดหมู่', type: 'text', value: t.category },
    { label: 'จำนวนเงิน', type: 'number', value: t.amount },
    { label: 'ประเภท', type: 'select', value: t.type, options: [{value:'income', text:'รายรับ'}, {value:'expense', text:'รายจ่าย'}] }
  ], async (vals) => {
    const cat = vals[0].trim();
    const amt = parseFloat(vals[1]);
    const type = vals[2];
    if (!cat || isNaN(amt) || amt <= 0) throw new Error('ข้อมูลไม่ถูกต้อง');
    // Using simple update since this is admin force-override. 
    // WARNING: Direct transaction update via Supabase API does NOT trigger the trigger that recalculates account balances automatically in standard setups unless built that way.
    // If the system relies on RPCs to update balances, this direct edit will cause balance mismatches.
    // Given the prompt asks to "fix bad data", updating the transaction row is provided, but user might need to fix balance manually via editAccountBalance.
    const { error } = await supabase.from('transactions').update({ category: cat, amount: amt, type: type }).eq('id', id);
    if (error) throw error;
    toast('แก้ไขธุรกรรมสำเร็จ (โปรดเช็คยอดบัญชีด้วยหากจำเป็น)', 'success');
  });
};

window.deleteTx = async (id) => {
  if (!confirm('ลบธุรกรรมนี้อย่างถาวร?')) return;
  const { error } = await supabase.from('transactions').delete().eq('id', id);
  if (error) return toast(error.message, 'error');
  toast('ลบสำเร็จ', 'success');
  loadData();
};


// 4. ข้อมูลพื้นฐาน (Master Data)
function renderMasterTab() {
  let html = `<div class="space-y-6">
                <div>
                  <h2 class="font-display text-lg font-semibold mb-3">สินค้า (Products)</h2>
                  <div class="space-y-2">`;
  appData.prods.forEach(p => {
    html += `
      <div class="bg-surface rounded-xl p-3 shadow-sm border border-hairline flex items-center justify-between">
        <div>
          <p class="text-sm font-medium">${escapeHTML(p.name)}</p>
          <p class="text-xs text-muted mt-0.5">ขาย: ฿${fmtMoney(p.selling_price)} | Alert: ${p.min_stock_alert}</p>
        </div>
        <button onclick="editProductMaster('${p.id}')" class="w-8 h-8 rounded bg-primary-light flex items-center justify-center text-primary-dark"><span class="material-symbols-outlined text-[16px]">edit</span></button>
      </div>`;
  });
  
  html += `</div></div><div>
            <h2 class="font-display text-lg font-semibold mb-3">ตึก & ชั้น (Buildings)</h2>
            <div class="space-y-3">`;
            
  appData.bldgs.forEach(b => {
    const bshelves = appData.shelves.filter(s => s.building_id === b.id);
    html += `
      <div class="bg-surface rounded-xl p-4 shadow-sm border border-hairline">
        <div class="flex justify-between items-center mb-2">
          <p class="font-medium text-primary-dark">${escapeHTML(b.name)}</p>
          <button onclick="editBldg('${b.id}')" class="text-muted"><span class="material-symbols-outlined text-[16px]">edit</span></button>
        </div>
        <div class="flex flex-wrap gap-2">
          ${bshelves.map(s => `<span class="text-xs bg-background border border-hairline px-2 py-1 rounded flex items-center gap-1">ชั้น ${s.floor} <span onclick="deleteShelfMaster('${s.id}')" class="material-symbols-outlined text-[12px] text-error cursor-pointer ml-1">close</span></span>`).join('')}
        </div>
      </div>`;
  });
            
  return html + '</div></div></div>';
}

window.editProductMaster = (id) => {
  const p = appData.prods.find(x => x.id === id);
  openModal(`แก้ไขข้อมูลสินค้า`, [
    { label: 'ชื่อสินค้า', type: 'text', value: p.name },
    { label: 'ราคาขาย', type: 'number', value: p.selling_price },
    { label: 'แจ้งเตือนเมื่อต่ำกว่า', type: 'number', value: p.min_stock_alert }
  ], async (vals) => {
    const name = vals[0].trim();
    const price = parseFloat(vals[1]);
    const min = parseInt(vals[2]);
    if (!name || isNaN(price)) throw new Error('ข้อมูลไม่ครบ');
    const { error } = await supabase.from('products').update({ name, selling_price: price, min_stock_alert: min }).eq('id', id);
    if (error) throw error;
    toast('อัปเดตสินค้าสำเร็จ', 'success');
  });
};

window.editBldg = (id) => {
  const b = appData.bldgs.find(x => x.id === id);
  openModal(`แก้ไขชื่อตึก`, [
    { label: 'ชื่อตึก', type: 'text', value: b.name }
  ], async (vals) => {
    const name = vals[0].trim();
    if (!name) throw new Error('กรุณาระบุชื่อ');
    const { error } = await supabase.from('buildings').update({ name }).eq('id', id);
    if (error) throw error;
    toast('แก้ไขตึกสำเร็จ', 'success');
  });
};

window.deleteShelfMaster = async (id) => {
  if (!confirm('ยืนยันลบชั้นวางนี้? (หากมีของวางอยู่จะ Error)')) return;
  const { error } = await supabase.from('shelves').delete().eq('id', id);
  if (error) return toast(error.message, 'error');
  toast('ลบชั้นสำเร็จ', 'success');
  loadData();
};


// --- INITIALIZATION ---
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', (e) => {
    document.querySelectorAll('.tab-btn').forEach(b => {
      b.classList.remove('bg-white', 'text-primary-dark');
      b.classList.add('text-white/80');
    });
    e.target.classList.remove('text-white/80');
    e.target.classList.add('bg-white', 'text-primary-dark');
    
    currentTab = e.target.dataset.tab;
    renderTab();
  });
});

function renderDiscrepanciesTab() {
  let html = `<div class="flex justify-between items-center mb-4">
                <h2 class="font-display text-lg font-semibold">ส่วนต่างสต็อกและยอดเงินเงา (Discrepancies)</h2>
                <span class="text-xs text-muted">ใช้คำนวณ "พบส่วนต่างที่ยังไม่ได้อธิบาย"</span>
              </div>
              <div class="space-y-3">`;
              
  // แก้ไข: ใส่ ( ... || []) ดักจับกรณีดึงข้อมูลมาได้เป็น null
  (appData.disc || []).forEach(d => {
    const ps = appData.pshelves.find(x => x.id === d.product_shelf_id);
    const p = ps ? appData.prods.find(x => x.id === ps.product_id) : null;
    html += `
      <div class="bg-surface rounded-xl p-4 shadow-sm border border-hairline flex items-center justify-between">
        <div>
          <p class="font-medium text-sm">${p ? escapeHTML(p.name) : 'สินค้าทั่วไป'} <span class="text-xs text-error font-mono">(${d.diff_qty} ชิ้น)</span></p>
          <p class="text-xs text-muted mt-0.5">เหตุผล: ${escapeHTML(d.reason || 'ไม่ระบุ')} | วันที่: ${new Date(d.created_at).toLocaleString('th-TH')}</p>
          <div class="flex gap-3 mt-2">
            <span class="text-xs bg-hairline px-2 py-1 rounded">มูลค่าเงา: <b>฿${fmtMoney(d.value_at_selling_price)}</b></span>
            <span class="text-xs ${d.resolved_as ? 'bg-secondary/10 text-secondary' : 'bg-warning/10 text-warning'} px-2 py-1 rounded">${d.resolved_as ? 'เคลียร์แล้ว' : 'ยังไม่เคลียร์'}</span>
          </div>
        </div>
        <div class="flex gap-2">
          <button onclick="editDiscrepancy('${d.id}')" class="w-9 h-9 rounded-lg bg-background border border-hairline flex items-center justify-center text-primary">
            <span class="material-symbols-outlined text-[18px]">edit</span>
          </button>
          <button onclick="deleteDiscrepancy('${d.id}')" class="w-9 h-9 rounded-lg bg-error/10 border border-error/20 flex items-center justify-center text-error">
            <span class="material-symbols-outlined text-[18px]">delete</span>
          </button>
        </div>
      </div>`;
  });
  return html + '</div>';
}

window.editDiscrepancy = (id) => {
  const d = appData.disc.find(x => x.id === id);
  openModal(`แก้ไขยอดส่วนต่างเงา`, [
    { label: 'มูลค่าคำนวณ (Value at Selling Price)', type: 'number', value: d.value_at_selling_price },
    { label: 'สถานะการเคลียร์ (resolved_as หรือเว้นว่าง)', type: 'text', value: d.resolved_as || '' }
  ], async (vals) => {
    const val = parseFloat(vals[0]);
    const resolved = vals[1].trim() || null;
    if (isNaN(val)) throw new Error('มูลค่าไม่ถูกต้อง');
    const { error } = await supabase.from('stock_discrepancies').update({ value_at_selling_price: val, resolved_as: resolved }).eq('id', id);
    if (error) throw error;
    toast('อัปเดตยอดส่วนต่างเงาสำเร็จ', 'success');
  });
};

window.deleteDiscrepancy = async (id) => {
  if (!confirm('ยืนยันลบรายการส่วนต่างนี้? (ยอดคำนวณเงาจะหายไปจากระบบทันที)')) return;
  const { error } = await supabase.from('stock_discrepancies').delete().eq('id', id);
  if (error) return toast(error.message, 'error');
  toast('ลบรายการส่วนต่างสำเร็จ', 'success');
  loadData();
};
loadData();


</script>
</body>
</html>
