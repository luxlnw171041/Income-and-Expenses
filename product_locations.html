<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">

<!-- Fonts & Icons -->
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  // แมปปิ้งสีและระยะห่างของระบบ Material Design กับสีธีมแอปเดิม (เขียว #145C52)
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          background: '#F5F7F1',
          surface: '#F5F7F1',
          'surface-container-low': '#FFFFFF',
          'surface-container': '#FFFFFF',
          'surface-container-high': '#EAECE6',
          primary: '#145C52',
          'on-primary': '#FFFFFF',
          'primary-container': '#E4EFEA',
          'on-primary-container': '#0E453D',
          'secondary-fixed': '#3FA34D', // สีเขียวสำเร็จ
          'secondary-container': '#E4F5E7',
          'tertiary-fixed': '#D98A22', // สีส้มรอจัดวาง (Pending)
          'tertiary-container': '#FCEBD1',
          error: '#D9483F',
          'error-container': '#FBE4E2',
          'on-error': '#FFFFFF',
          'on-surface': '#1B2420',

          'outline-variant': '#E4E7E0',

          'margin-mobile': '1rem',
          'stack-sm': '0.5rem',
          'stack-md': '1rem',
          'touch-target-min': '3rem',
        }
      }
    }
  }
</script>
<style>
  * { -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Sarabun', sans-serif; background: #F5F7F1; color: #1B2420; overflow-x: hidden; }
  
  /* Typography Classes */
  .font-label-md { font-family: 'Kanit', sans-serif; font-size: 0.75rem; font-weight: 500; }
  .text-label-md { font-size: 0.75rem; line-height: 1rem; }
  .font-headline-lg-mobile { font-family: 'Kanit', sans-serif; font-size: 1.5rem; font-weight: 600; }
  .text-headline-lg-mobile { font-size: 1.5rem; line-height: 2rem; }
  .font-headline-lg { font-family: 'Kanit', sans-serif; font-size: 2rem; font-weight: 600; }
  .text-headline-lg { font-size: 2.25rem; line-height: 2.5rem; }
  .font-body-md { font-family: 'Sarabun', sans-serif; font-size: 1rem; }
  .text-body-md { font-size: 1rem; line-height: 1.5rem; }
  .font-body-sm { font-family: 'Sarabun', sans-serif; font-size: 0.875rem; }
  .text-body-sm { font-size: 0.875rem; line-height: 1.25rem; }

  /* Utilities */
  .hide-scrollbar::-webkit-scrollbar { display: none; }
  .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  .pb-safe { padding-bottom: calc(env(safe-area-inset-bottom) + 1rem); }
  
  /* Toast */
  #toast-wrap { position: fixed; top: 16px; left: 0; right: 0; z-index: 99; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; }
  .toast { pointer-events:auto; animation: toastIn .3s cubic-bezier(.22,.9,.32,1) both; }
  @keyframes toastIn { from { opacity:0; transform: translateY(-16px) scale(.96);} to { opacity:1; transform:none; } }
  .toast.out { animation: toastOut .2s ease forwards; }
  @keyframes toastOut { to { opacity:0; transform: translateY(-10px) scale(.97); } }
</style>
</head>
<body class="antialiased max-w-md mx-auto min-h-screen flex flex-col relative">

<!-- Header เดิม -->

  <h1 class="font-headline-lg-mobile text-[17px] font-semibold text-on-surface">ระบบตรวจสอบจุดวางสินค้า</h1>
</header>

<!-- Main App (ดีไซน์ใหม่) -->
<main class="pb-32 min-h-screen bg-background">
  <div class="flex flex-col w-full h-full relative" id="shelf-management-root">
    
    <!-- Dynamic Stats (เลื่อนซ้ายขวาได้บนมือถือ) -->
    <div class="px-margin-mobile flex gap-4 overflow-x-auto snap-x snap-mandatory hide-scrollbar pb-stack-md pt-stack-sm -mx-margin-mobile w-[calc(100%+2rem)] pl-margin-mobile mt-4">
      <div class="snap-start shrink-0 w-32 bg-surface-container rounded-xl p-3 shadow-sm flex flex-col justify-between">
        <div class="w-8 h-8 rounded-full bg-primary/10 flex items-center justify-center text-primary mb-2">
          <span class="material-symbols-outlined text-[18px]">inventory_2</span>
        </div>
        <div class="flex flex-col">
          <span class="font-label-md text-label-md text-on-surface-variant uppercase">All Products</span>
          <span id="stat-total" class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">-</span>
        </div>
      </div>
      <div class="snap-start shrink-0 w-32 bg-secondary-fixed/10 rounded-xl p-3 shadow-sm flex flex-col justify-between">
        <div class="w-8 h-8 rounded-full bg-secondary-fixed/20 flex items-center justify-center text-secondary-fixed mb-2">
          <span class="material-symbols-outlined text-[18px]">check_circle</span>
        </div>
        <div class="flex flex-col">
          <span class="font-label-md text-label-md text-secondary-fixed uppercase">Completed</span>

      </div>
      <div class="snap-start shrink-0 w-32 bg-tertiary-fixed/10 rounded-xl p-3 shadow-sm flex flex-col justify-between pr-margin-mobile">
        <div class="w-8 h-8 rounded-full bg-tertiary-fixed/20 flex items-center justify-center text-tertiary-fixed mb-2">

        <div class="flex flex-col">
          <span class="font-label-md text-label-md text-tertiary-fixed uppercase">Pending</span>
          <span id="stat-pending" class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">-</span>
        </div>
      </div>
    </div>

    <!-- Search / Filter Area (ทำให้ค้นหาได้จริง) -->
    <div class="px-margin-mobile mb-stack-md mt-2">
      <div class="relative flex items-center w-full h-touch-target-min bg-surface-container rounded-full px-4 shadow-sm border border-outline-variant/50 focus-within:border-primary transition-all">
        <span class="material-symbols-outlined text-on-surface-variant mr-2">search</span>
        <input id="searchInput" onkeyup="searchProducts(this.value)" class="bg-transparent w-full font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/70 focus:outline-none" placeholder="ค้นหารหัส หรือ ชื่อสินค้า..." type="text"/>
      </div>
    </div>

    <!-- Grid สินค้า -->
    <div id="product-grid" class="px-margin-mobile grid grid-cols-2 gap-3 pb-24">
      <p class="col-span-2 text-center text-on-surface-variant text-body-sm py-10">กำลังโหลดข้อมูล...</p>
    </div>

    <!-- Bottom Sheet Details -->
    <div class="fixed inset-x-0 bottom-0 z-[60] bg-surface-container-high rounded-t-[32px] shadow-[0_-10px_40px_rgba(0,0,0,0.15)] transition-transform duration-300 ease-out flex flex-col translate-y-full" id="bottom-sheet" style="max-height: 90vh;">
      
      <!-- Drag Handle -->

      </div>
      
      <div class="px-margin-mobile flex-1 overflow-y-auto pb-safe">
        <!-- Sheet Header -->
        <div class="flex justify-between items-start mb-6 gap-2">
          <div class="flex-1 min-w-0">
            <span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">Product Details</span>
            <h2 id="bs-title" class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface leading-tight mt-1">...</h2>
          </div>
          <div id="bs-status-badge" class="px-3 py-1.5 bg-secondary-container/50 rounded-full flex items-center shrink-0 border">
            <span id="bs-status-dot" class="w-2 h-2 rounded-full bg-secondary-fixed mr-2"></span>
            <span id="bs-status-text" class="font-label-md text-label-md text-secondary-fixed whitespace-nowrap">...</span>
          </div>
        </div>

        <!-- Total Stock Box -->
        <div class="bg-surface-container rounded-2xl p-4 mb-6 shadow-sm border border-outline-variant/40">
          <div class="flex items-center">
            <div class="w-14 h-14 rounded-xl bg-surface flex items-center justify-center mr-4 border border-outline-variant/30">
              <span class="material-symbols-outlined text-primary text-[28px]">category</span>
            </div>
            <div class="flex-1">
              <span class="block font-label-md text-label-md text-on-surface-variant mb-1">TOTAL IN SYSTEM</span>
              <span id="bs-subtitle" class="font-headline-lg text-headline-lg text-on-surface leading-none">0</span>
            </div>
          </div>
        </div>

        <!-- รายการจุดวาง และฟอร์มเพิ่ม (Inject by JS) -->
        <div id="bs-content" class="mb-4"></div>

      </div>
    </div>
    
    <!-- Scrim (พื้นหลังดำ) -->
    <div class="fixed inset-0 bg-on-surface/40 backdrop-blur-sm z-[55] transition-opacity duration-300 opacity-0 pointer-events-none" id="scrim" onclick="toggleBottomSheet(false)"></div>
  
  </div>
</main>


<!-- JavaScript Core -->
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

/* ============================================================
   CONFIG — ใส่ค่า Supabase ให้ตรงกับไฟล์หลัก (index.html)
   (เดิมไฟล์นี้อ้างถึง SUPABASE_URL / SUPABASE_ANON_KEY โดยไม่เคยประกาศ
   ตัวแปรไว้เลย ทำให้หน้านี้ throw ReferenceError และโหลดไม่ขึ้นตั้งแต่แรก)
   ============================================================ */
 const SUPABASE_URL = 'https://dfemavcrzpmmgqqjrxvz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmZW1hdmNyenBtbWdxcWpyeHZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2ODY4NTEsImV4cCI6MjEwMTI2Mjg1MX0.JYsRkjRwbAqKxqB9MT5iMDOeh5zh087sWmKo_Jx1cbc';

const CONFIGURED = !SUPABASE_URL.includes('YOUR_SUPABASE_URL') && !!SUPABASE_ANON_KEY && !SUPABASE_ANON_KEY.includes('YOUR_SUPABASE');
const supabase = CONFIGURED ? createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

window._appData = { products: [], batches: [], productShelves: [], shelves: [], buildings: [], shelvesMap: {} };
window._currentOpenProductId = null;

function toast(msg, kind = 'info') {
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  // แมปสี Toast ให้เข้ากับระบบ
  const styles = { 
    info: 'bg-on-surface text-surface', 
    success: 'bg-secondary-fixed text-white', 
    error: 'bg-error text-white' 
  };
  el.className = `toast ${styles[kind] || styles.info} font-body-sm px-5 py-3 rounded-full shadow-lg max-w-[90%] text-center font-medium`;
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 250); }, 2600);
}

window.toggleBottomSheet = (show) => {
  const sheet = document.getElementById('bottom-sheet');
  const scrim = document.getElementById('scrim');
  if (show) {
    sheet.classList.remove('translate-y-full');
    scrim.classList.remove('opacity-0', 'pointer-events-none');
    scrim.classList.add('opacity-100', 'pointer-events-auto');
  } else {
    sheet.classList.add('translate-y-full');
    scrim.classList.remove('opacity-100', 'pointer-events-auto');
    scrim.classList.add('opacity-0', 'pointer-events-none');
    window._currentOpenProductId = null;
  }
}

// ฟังก์ชันสำหรับช่องค้นหา (ทำงานแบบ Real-time)
window.searchProducts = (query) => {
  const q = query.toLowerCase().trim();
  const items = document.querySelectorAll('.product-card-item');
  let visibleCount = 0;
  
  items.forEach(el => {
    const name = el.getAttribute('data-name').toLowerCase();
    const id = el.getAttribute('data-id').toLowerCase();
    if (name.includes(q) || id.includes(q)) {
      el.style.display = 'flex';
      visibleCount++;
    } else {
      el.style.display = 'none';
    }
  });

  const grid = document.getElementById('product-grid');
  let noMsg = document.getElementById('no-result-msg');
  
  if (visibleCount === 0) {
    if (!noMsg) {
      grid.insertAdjacentHTML('beforeend', `<p id="no-result-msg" class="col-span-2 text-center text-on-surface-variant font-body-sm py-10">ไม่พบสินค้าที่ค้นหา</p>`);
    }
  } else if (noMsg) {
    noMsg.remove();
  }
}

// Derives the 3 possible placement states for a product: 'over' (assigned more
// than the actual stock on hand — a data problem, shown in red), 'complete'
// (exactly matches, green), or 'pending' (still has unassigned units, orange).
// Previously "complete" was just `unassigned <= 0`, so an over-assigned item
// (a symptom of the quantity-doubling bug below) looked identical to a
// correctly fully-placed one — this makes that class of mistake visible.
function getPlacementStatus(totalStock, assignedStock) {
  const unassigned = totalStock - assignedStock;
  if (unassigned < 0) return { state: 'over', unassigned };
  if (unassigned === 0) return { state: 'complete', unassigned };
  return { state: 'pending', unassigned };
}

async function loadData() {
  try {
    const [
      { data: products }, { data: batches }, { data: productShelves },
      { data: shelves }, { data: buildings }
    ] = await Promise.all([
      supabase.from('products').select('*').order('name'),
      supabase.from('stock_batches').select('*'),
      supabase.from('product_shelves').select('*'),
      supabase.from('shelves').select('*'),
      supabase.from('buildings').select('*')
    ]);

    const shelvesMap = {};
    shelves.forEach(s => {
      const b = buildings.find(x => x.id === s.building_id);
      shelvesMap[s.id] = { ...s, building_name: b ? b.name : 'ไม่ระบุตึก' };
    });

    window._appData = { products, batches, productShelves, shelves, buildings, shelvesMap };
    
    renderGrid();

    // หากเปิด Sheet ค้างไว้ ให้โหลดข้อมูลด้านในใหม่แบบเนียนๆ
    if (window._currentOpenProductId) {
      window.openProduct(window._currentOpenProductId);
    }

  } catch (err) {
    toast('โหลดข้อมูลล้มเหลว: ' + err.message, 'error');
  }
}

function renderGrid() {
  let fullyAssignedCount = 0;
  let pendingCount = 0;

  const html = window._appData.products.map(p => {
    const pBatches = window._appData.batches.filter(b => b.product_id === p.id);
    const totalStock = pBatches.reduce((sum, b) => sum + b.remaining_qty, 0);
    const pLocations = window._appData.productShelves.filter(ps => ps.product_id === p.id);
    const assignedStock = pLocations.reduce((sum, loc) => sum + loc.quantity, 0);
    const { state, unassigned } = getPlacementStatus(totalStock, assignedStock);

    if (state !== 'pending') fullyAssignedCount++; else pendingCount++;

    const styleByState = {
      complete: { card: 'bg-surface-container', bar: 'bg-secondary-fixed', icon: 'text-secondary-fixed', iconName: 'check_circle', note: 'text-on-surface-variant', label: `รวม: ${totalStock} ชิ้น` },
      pending:  { card: 'bg-tertiary-container/30', bar: 'bg-tertiary-fixed', icon: 'text-tertiary-fixed', iconName: 'warning', note: 'text-tertiary-fixed', label: `รอจัดวาง: ${unassigned} ชิ้น` },
      over:     { card: 'bg-error-container/40', bar: 'bg-error', icon: 'text-error', iconName: 'error', note: 'text-error', label: `เกินจำนวนจริง: ${Math.abs(unassigned)} ชิ้น` },
    }[state];

    return `
      <!-- แนบ data-name และ data-id ไว้สำหรับใช้ระบบค้นหา -->
      <button data-name="${p.name}" data-id="PRD-${p.id.toString().substring(0,4)}" class="product-card-item relative flex flex-col ${styleByState.card} rounded-2xl p-3.5 h-32 shadow-sm text-left transition-transform active:scale-95 overflow-hidden border border-outline-variant/30" onclick="openProduct('${p.id}')">
        <div class="absolute top-0 left-0 w-1.5 h-full ${styleByState.bar}"></div>
        <div class="flex justify-between items-start mb-3 pl-2 w-full">
          <span class="font-label-md text-label-md text-on-surface-variant truncate pr-2">PRD-${p.id.toString().substring(0,4)}</span>
          <span class="material-symbols-outlined ${styleByState.icon} text-[20px]">
            ${styleByState.iconName}
          </span>
        </div>
        <div class="pl-2 w-full">
          <!-- บังคับให้ชื่อสินค้าแสดงได้ 2 บรรทัดถ้ายาวเกินไป -->
          <div class="font-body-sm text-on-surface line-clamp-2 font-medium leading-tight">${p.name}</div>
          <div class="font-label-md text-[11px] ${styleByState.note} mt-1.5">
            ${styleByState.label}
          </div>
        </div>
      </button>
    `;
  }).join('');

  document.getElementById('product-grid').innerHTML = html || '<p class="col-span-2 text-center text-on-surface-variant font-body-sm py-10">ไม่พบสินค้าในระบบ</p>';
  document.getElementById('stat-total').innerText = window._appData.products.length;
  document.getElementById('stat-complete').innerText = fullyAssignedCount;
  document.getElementById('stat-pending').innerText = pendingCount;
  
  // ให้ช่องค้นหากรองข้อมูลใหม่ทุกครั้งที่รีเฟรชข้อมูล (เพื่อไม่ให้บั๊ก)
  const q = document.getElementById('searchInput').value;
  if(q) window.searchProducts(q);
}

window.openProduct = (productId) => {
  window._currentOpenProductId = productId;
  const p = window._appData.products.find(x => x.id === productId);
  const pBatches = window._appData.batches.filter(b => b.product_id === p.id);
  const totalStock = pBatches.reduce((sum, b) => sum + b.remaining_qty, 0);
  const pLocations = window._appData.productShelves.filter(ps => ps.product_id === p.id);
  const assignedStock = pLocations.reduce((sum, loc) => sum + loc.quantity, 0);
  const { state, unassigned } = getPlacementStatus(totalStock, assignedStock);

  document.getElementById('bs-title').innerText = p.name;
  document.getElementById('bs-subtitle').innerText = totalStock;

  const badgeByState = {
    complete: { wrap: 'bg-secondary-container/40 border-secondary-fixed/30', dot: 'bg-secondary-fixed', text: 'text-secondary-fixed', label: 'จัดวางครบแล้ว' },
    pending:  { wrap: 'bg-tertiary-container/40 border-tertiary-fixed/30', dot: 'bg-tertiary-fixed', text: 'text-tertiary-fixed', label: `รอวาง ${unassigned}` },
    over:     { wrap: 'bg-error-container/40 border-error/30', dot: 'bg-error', text: 'text-error', label: `เกิน ${Math.abs(unassigned)}` },
  }[state];

  document.getElementById('bs-status-badge').className = `px-3 py-1.5 rounded-full flex items-center border shrink-0 ${badgeByState.wrap}`;
  document.getElementById('bs-status-text').innerText = badgeByState.label;
  document.getElementById('bs-status-text').className = `font-label-md text-label-md ${badgeByState.text}`;
  document.getElementById('bs-status-dot').className = `w-2 h-2 rounded-full mr-1.5 ${badgeByState.dot}`;

  // สร้าง UI รายการชั้นวาง
  const locsHtml = pLocations.map(loc => {
    const sInfo = window._appData.shelvesMap[loc.shelf_id];
    return `
      <div class="flex items-center gap-2.5 mb-3 bg-surface rounded-2xl p-2.5 border border-outline-variant shadow-sm">
        <div class="w-10 h-10 rounded-xl bg-surface-container-high flex items-center justify-center shrink-0">
          <span class="material-symbols-outlined text-primary text-[20px]">shelves</span>
        </div>
        <div class="flex-1 min-w-0">
          <div class="font-label-md text-on-surface truncate text-sm">${sInfo.building_name}</div>
          <div class="font-label-md text-on-surface-variant text-[11px]">ชั้น ${sInfo.floor}</div>
        </div>
        
        <!-- ใช้ inputmode="numeric" และ pattern="[0-9]*" ช่วยให้มือถือเด้งแป้นตัวเลขขึ้นมาทันที -->
        <input id="qty-${loc.id}" type="number" inputmode="numeric" pattern="[0-9]*" value="${loc.quantity}" class="w-14 h-11 text-center font-mono font-medium text-body-md bg-surface-container border border-outline-variant/50 rounded-xl outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all">
        
        <button onclick="updateQty('${loc.id}', '${loc.shelf_id}', '${p.id}')" class="w-11 h-11 bg-primary text-white rounded-xl flex items-center justify-center active:scale-95 shadow-sm">
          <span class="material-symbols-outlined text-[20px]">save</span>
        </button>
        <button onclick="removeLoc('${loc.id}')" class="w-11 h-11 bg-error-container text-error rounded-xl flex items-center justify-center active:scale-95 border border-error/10">
          <span class="material-symbols-outlined text-[20px]">delete</span>
        </button>
      </div>
    `;
  }).join('');

  // สร้างฟอร์มเพิ่มชั้นวาง — แสดงเฉพาะตอนยังเหลือของไม่ครบ (ไม่ใช่ตอนเกิน)
  let addFormHtml = '';
  if (state === 'over') {
    addFormHtml = `
      <div class="mt-5 pt-5 border-t border-outline-variant/60">
        <div class="bg-error-container/40 border border-error/20 rounded-2xl p-3.5 text-sm text-error">
          จำนวนที่จัดวางไว้ (${assignedStock} ชิ้น) มากกว่าสต็อกจริงในระบบ (${totalStock} ชิ้น) อยู่ ${Math.abs(unassigned)} ชิ้น —
          กรุณาแก้ไขจำนวนที่จุดวางด้านบนให้ตรงกับความเป็นจริงก่อน
        </div>
      </div>
    `;
  } else if (state === 'pending') {
    const bldOpts = window._appData.buildings.map(b => `<option value="${b.id}">${b.name}</option>`).join('');
    addFormHtml = `
      <div class="mt-5 pt-5 border-t border-outline-variant/60">
        <span class="font-label-md text-primary mb-3 flex items-center">
          <span class="material-symbols-outlined text-[18px] mr-1.5">add_circle</span> 
          จัดวางเพิ่ม (เหลือ ${unassigned} ชิ้น)
        </span>
        <div class="flex flex-col gap-3">
          <div class="flex gap-3">
            <select id="bld-${p.id}" onchange="loadShelves('${p.id}', this.value)" class="flex-1 bg-surface-container rounded-xl px-3 h-12 outline-none font-body-sm text-on-surface border border-outline-variant/60 focus:border-primary shadow-sm appearance-none">
              <option value="" disabled selected>เลือกตึก...</option>
              ${bldOpts}
            </select>
            <select id="shlf-${p.id}" class="flex-1 bg-surface-container rounded-xl px-3 h-12 outline-none font-body-sm text-on-surface border border-outline-variant/60 focus:border-primary shadow-sm appearance-none" disabled>
              <option>รอเลือกตึก...</option>
            </select>
          </div>
          <div class="flex gap-3">
            <input id="addqty-${p.id}" type="number" inputmode="numeric" pattern="[0-9]*" placeholder="ระบุจำนวน" class="flex-1 bg-surface-container rounded-xl px-4 h-12 outline-none font-body-md text-on-surface border border-outline-variant/60 focus:border-primary shadow-sm">
            <button onclick="addToNewShelf('${p.id}')" class="h-12 px-8 bg-primary text-white rounded-xl font-label-md active:scale-95 flex items-center justify-center shadow-md whitespace-nowrap">
               บันทึก
            </button>
          </div>
        </div>
      </div>
    `;
  }

  const contentArea = document.getElementById('bs-content');
  if(pLocations.length === 0) {
    contentArea.innerHTML = `<div class="bg-surface-container rounded-2xl p-6 text-center border border-dashed border-outline-variant mb-2"><span class="font-body-sm text-on-surface-variant">สินค้านี้ยังไม่ได้ถูกนำไปวางบนชั้น</span></div>` + addFormHtml;
  } else {
    contentArea.innerHTML = locsHtml + addFormHtml;
  }
  
  toggleBottomSheet(true);
};

window.loadShelves = (productId, buildingId) => {
  const shelves = window._appData.shelves.filter(s => s.building_id === buildingId);
  const sel = document.getElementById(`shlf-${productId}`);
  sel.innerHTML = '<option value="" disabled selected>เลือกชั้น...</option>' + 
                  shelves.map(s => `<option value="${s.id}">ชั้น ${s.floor}</option>`).join('');
  sel.disabled = false;
};

window.updateQty = async (rowId, shelfId, productId) => {
  const val = parseInt(document.getElementById(`qty-${rowId}`).value, 10);
  if (isNaN(val) || val < 0) return toast('กรุณาระบุจำนวนให้ถูกต้อง', 'error');
  try {
    // BUG FIX: this used to call the `assign_product_to_shelf` RPC, which
    // ADDS p_qty on top of whatever quantity is already stored (it's meant
    // for the "add newly-placed stock" flow in addToNewShelf below). Reusing
    // it here to edit an existing row meant typing 5 to replace 2 actually
    // saved 2 + 5 = 7. Editing an existing placement must SET the exact
    // value the user typed, so update the row directly instead.
    const { error } = await supabase
      .from('product_shelves')
      .update({ quantity: val })
      .eq('id', rowId);
    if (error) throw error;
    toast('บันทึกจำนวนใหม่สำเร็จ ✓', 'success');
    loadData();
  } catch (err) { toast(err.message, 'error'); }
};

window.removeLoc = async (rowId) => {
  if(!confirm('ลบการจัดวางออกจากชั้นนี้ใช่หรือไม่?')) return;
  try {
    const { error } = await supabase.from('product_shelves').delete().eq('id', rowId);
    if (error) throw error;
    toast('ลบออกจากชั้นสำเร็จ', 'success');
    loadData();
  } catch (err) { toast(err.message, 'error'); }
};

window.addToNewShelf = async (productId) => {
  const shelfId = document.getElementById(`shlf-${productId}`).value;
  const qty = parseInt(document.getElementById(`addqty-${productId}`).value, 10);
  if (!shelfId) return toast('กรุณาเลือกตึกและชั้นก่อน', 'error');
  if (!qty || qty <= 0) return toast('กรุณาระบุจำนวนสินค้า', 'error');

  try {
    // This only ever runs for a shelf+product combination that has no row
    // yet (it's rendered inside the "เลือกตึก/ชั้น" add form, not next to an
    // existing location card), so a plain upsert with the entered qty is the
    // correct — and unambiguous — way to create it. No need for the additive
    // RPC here either, since there's nothing to add on top of.
    const { error } = await supabase
      .from('product_shelves')
      .upsert({ shelf_id: shelfId, product_id: productId, quantity: qty }, { onConflict: 'shelf_id,product_id' });
    if (error) throw error;
    toast('เพิ่มลงชั้นวางสำเร็จ ✓', 'success');
    loadData();
  } catch (err) { toast(err.message, 'error'); }
};

// Start App
if (!CONFIGURED) {
  document.getElementById('product-grid').innerHTML = `
    <div class="col-span-2 bg-error-container border border-error/30 text-error rounded-2xl p-4 text-sm">
      ยังไม่ได้ตั้งค่า Supabase — กรุณาใส่ค่า <b>SUPABASE_URL</b> และ <b>SUPABASE_ANON_KEY</b>
      ที่ด้านบนของไฟล์ก่อนใช้งานจริง
    </div>`;
  toast('ยังไม่ได้ตั้งค่า Supabase', 'error');
} else {
  loadData();
}
</script>
</body>
